services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: therapity
      POSTGRES_USER: therapity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-therapity_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapity"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://therapity:${POSTGRES_PASSWORD:-therapity_dev}@db:5432/therapity
      - DEBUG=true
    volumes:
      - ./backend:/app  # Auto-reload on code change
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend-react/src:/app/src      # HMR on save
      - ./frontend-react/public:/app/public
      - ./frontend-react/index.html:/app/index.html
      - ./frontend-react/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

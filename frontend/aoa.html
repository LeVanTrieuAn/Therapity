    <style>
        body {
            background-color: #000000;
            color: #f8f9fa;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-page-fade {
            animation: pageFadeIn 0.8s ease-out forwards;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-modal-in {
            animation: modalIn 0.3s ease-out forwards;
        }

        .glass-panel {
            background-color: rgba(28, 32, 38, 0.95);
            border: 1px solid rgba(255, 225, 109, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse-yellow-glow {

            0%,
            100% {
                border-color: rgba(255, 215, 0, 0.25);
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.1), inset 0 0 10px rgba(255, 215, 0, 0.02);
                background-color: rgba(28, 32, 38, 0.7);
            }

            50% {
                border-color: rgba(255, 215, 0, 0.85);
                box-shadow: 0 0 35px rgba(255, 215, 0, 0.35), inset 0 0 25px rgba(255, 215, 0, 0.1);
                background-color: rgba(255, 215, 0, 0.04);
            }
        }

        .glass-panel-active {
            animation: pulse-yellow-glow 1.2s ease-in-out infinite;
            
            transition: all 0.3s ease-in-out;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 10px;
        }

        /* Light Theme Overrides for AOA Feed Posts */
        html.light .glass-panel {
            background-color: #ffffff !important;
            border-color: rgba(22, 32, 97, 0.15) !important;
            box-shadow: 0 4px 20px rgba(22, 32, 97, 0.05) !important;
        }

        html.light .glass-panel .text-white {
            color: #162061 !important;
        }

        html.light .glass-panel .text-white\/90 {
            color: rgba(22, 32, 97, 0.9) !important;
        }

        html.light .glass-panel .text-white\/80 {
            color: rgba(22, 32, 97, 0.8) !important;
        }

        html.light .glass-panel .text-white\/70 {
            color: rgba(22, 32, 97, 0.7) !important;
        }

        html.light .glass-panel .text-white\/60 {
            color: rgba(22, 32, 97, 0.6) !important;
        }

        html.light .glass-panel .text-white\/50 {
            color: rgba(22, 32, 97, 0.5) !important;
        }

        html.light .glass-panel .text-white\/40 {
            color: rgba(22, 32, 97, 0.4) !important;
        }

        html.light .glass-panel .text-white\/30 {
            color: rgba(22, 32, 97, 0.3) !important;
        }

        html.light .glass-panel .text-white\/20 {
            color: rgba(22, 32, 97, 0.2) !important;
        }

        html.light .text-on-surface-variant {
            color: #162061 !important;
        }

        html.light #aoa-settings-dropdown {
            background-color: #ffffff !important;
            border-color: rgba(22, 32, 97, 0.15) !important;
            box-shadow: 0 10px 40px rgba(22, 32, 97, 0.1) !important;
        }

        html.dark #aoa-settings-dropdown {
            background-color: rgba(20, 24, 33, 0.96) !important;
            
            border-color: rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
        }

        html.light .glass-panel .border-white\/10,
        html.light .glass-panel .border-white\/5 {
            border-color: rgba(22, 32, 97, 0.15) !important;
        }

        html.light .glass-panel .bg-white\/5,
        html.light .glass-panel .bg-white\/10 {
            background-color: rgba(22, 32, 97, 0.05) !important;
        }

        html.light .glass-panel .bg-black\/40,
        html.light .glass-panel .bg-black\/60 {
            background-color: #f4f5f7 !important;
            border-color: rgba(22, 32, 97, 0.1) !important;
        }

        /* Light Theme Overrides for Mindset Radar Modal */
        html.light .mindset-overlay {
            background-color: rgba(255, 255, 255, 0.85) !important;
        }

        html.light .mindset-box {
            box-shadow: 0 0 50px rgba(22, 32, 97, 0.1) !important;
        }

        html.light .mindset-icon {
            color: #2563eb !important;
        }

        html.light .mindset-bg-soft {
            background-color: rgba(37, 99, 235, 0.05) !important;
            border-color: rgba(37, 99, 235, 0.1) !important;
        }

        html.light .mindset-hover:hover {
            color: #2563eb !important;
            background-color: rgba(37, 99, 235, 0.1) !important;
            border-color: rgba(37, 99, 235, 0.3) !important;
        }

        /* Premium Flag Buttons Style with Layered Stack & Opacity Overlap */
        .ts-flag-stack {
            position: relative;
            width: 48px;
            height: 32px;
            display: inline-block;
            cursor: pointer;
        }

        .ts-flag-btn {
            position: absolute;
            top: 0;
            left: 0;
            padding: 5px 7px;
            border-radius: 8px;
            background: rgba(49, 53, 60, 0.15);
            border: 1px solid rgba(77, 71, 50, 0.3);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                z-index 0.4s ease,
                background 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ts-flag-btn.ts-lang-active {
            z-index: 10;
            opacity: 1;
            transform: translate(0, 0) scale(1);
            background: rgba(255, 225, 109, 0.15);
            border-color: rgba(255, 225, 109, 0.6);
            box-shadow: 0 4px 12px rgba(255, 225, 109, 0.3);
        }

        .ts-flag-btn.ts-lang-inactive {
            z-index: 5;
            opacity: 0.25;
            transform: translate(6px, 4px) scale(0.92);
            background: rgba(49, 53, 60, 0.1);
            border-color: rgba(77, 71, 50, 0.2);
            box-shadow: none;
        }

        .ts-flag-stack:hover .ts-flag-btn.ts-lang-active {
            transform: translate(-2px, -2px) scale(1.02);
            border-color: rgba(255, 225, 109, 0.8);
            box-shadow: 0 6px 16px rgba(255, 225, 109, 0.4);
        }

        .ts-flag-stack:hover .ts-flag-btn.ts-lang-inactive {
            transform: translate(8px, 6px) scale(0.95);
            opacity: 0.75;
            background: rgba(49, 53, 60, 0.3);
            border-color: rgba(255, 225, 109, 0.35);
        }

        /* Custom scrollbar hiding helper */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

                                                            class="flex-1 py-2 border border-white/20 rounded-full font-bold text-[14px] tracking-widest hover:bg-white/10 transition-all text-white">
                                                            Hủy
                                                        </button>
                                                    </template>
                                                    <button
                                                        @click="if(post.overlay.type === 'confirm' && post.overlay.onConfirm) post.overlay.onConfirm(); post.overlay.show = false"
                                                        class="flex-1 py-2 bg-[#fbbf24] text-black rounded-full font-bold text-[14px] tracking-widest hover:bg-[#fbbf24] transition-all shadow-[0_0_15px_rgba(233,196,0,0.3)]">
                                                        <span
                                                            x-text="post.overlay.type === 'confirm' ? 'Xác nhận' : 'Đóng'"></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Repost Header Badge -->
                                <template x-if="post.reposted_post">
                                    <div class="flex items-center gap-2 mb-[-12px] opacity-80">
                                        <span class="material-symbols-outlined text-sm text-[#fbbf24]">repeat</span>
                                        <span class="text-[14px] font-bold tracking-widest text-[#fbbf24]">Bạn
                                            đã
                                            chia
                                            sẻ lại</span>
                                    </div>
                                </template>
                                <!-- Author Info -->
                                <div class="flex items-start justify-between">
                                    <div class="flex space-x-4">
                                        <div class="w-12 h-12 rounded-full bg-surface-container shrink-0 overflow-hidden border border-white/10 cursor-pointer"
                                            @click="openPublicProfile(post.author_name)">
                                            <img referrerpolicy="no-referrer"
                                                :src="getAuthorAvatar(post.author_name, post.author_avatar)"
                                                @error="$el.src='https://lh3.googleusercontent.com/a/default-user'"
                                                class="w-full h-full object-cover">
                                        </div>
                                        <div class="flex flex-col">
                                            <span
                                                class="font-body-md text-body-md font-semibold text-white cursor-pointer hover:text-[#fbbf24] transition-colors"
                                                @click="openPublicProfile(post.author_name)"
                                                x-text="getAuthorDisplayName(post.author_name, post.author_displayName)"></span>
                                            <div class="flex items-center gap-1.5 mt-0.5">
                                                <span class="font-label-sm text-label-sm text-on-surface-variant/80"
                                                    x-text="formatDateTime(post.timestamp)"></span>
                                                <span
                                                    class="text-on-surface-variant/30 text-[11px] select-none">•</span>
                                                <span
                                                    class="flex items-center gap-1 text-[10px] text-on-surface-variant/90 font-medium bg-white/5 hover:bg-white/10 px-1.5 py-0.5 rounded-full border border-white/5 transition-colors select-none"
                                                    :title="t('aoa.privacy_' + (post.post_privacy || 'public'))">
                                                    <span class="material-symbols-outlined text-[12px]"
                                                        x-text="post.post_privacy === 'private' ? 'lock' : (post.post_privacy === 'followers' ? 'group' : 'public')"></span>
                                                    <span
                                                        x-text="t('aoa.privacy_' + (post.post_privacy || 'public'))"></span>
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- More Options Menu -->
                                    <div class="relative" x-data="{ open: false }" @click.away="open = false">
                                        <button @click="open = !open"
                                            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-on-surface-variant hover:text-white transition-all">
                                            <span class="material-symbols-outlined text-xl">more_vert</span>
                                        </button>

                                        <div x-show="open" x-transition:enter="transition ease-out duration-100"
                                            x-transition:enter-start="opacity-0 scale-95"
                                            x-transition:enter-end="opacity-100 scale-100"
                                            class="absolute right-0 mt-2 w-48 bg-[#1e1e1e] border border-white/10 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] z-[60] overflow-hidden">
                                            <div class="py-1">

                                                <button @click="hidePost(post); open = false"
                                                    class="w-full text-left px-4 py-2 text-sm text-white hover:bg-white/10 flex items-center gap-2 transition-colors">
                                                    <span class="material-symbols-outlined text-sm"
                                                        x-text="post.hidden_by && post.hidden_by.includes(user.username) ? 'visibility' : 'visibility_off'"></span>
                                                    <span
                                                        x-text="post.hidden_by && post.hidden_by.includes(user.username) ? t('aoa.unhide_post') : t('aoa.hide_post')"></span>
                                                </button>
                                                <button @click="reportPost(post); open = false"
                                                    class="w-full text-left px-4 py-2 text-sm text-white hover:bg-white/10 flex items-center gap-2 transition-colors">
                                                    <span class="material-symbols-outlined text-sm">report</span>
                                                    <span x-text="t('aoa.report_post')"></span>
                                                </button>
                                                <template x-if="currentTab === 'deleted'">
                                                    <button @click="restorePost(post); open = false"
                                                        class="w-full text-left px-4 py-2 text-sm text-[#fbbf24] hover:bg-[#fbbf24]/10 flex items-center gap-2 transition-colors">
                                                        <span
                                                            class="material-symbols-outlined text-sm">settings_backup_restore</span>
                                                        <span x-text="t('aoa.restore_post')"></span>
                                                    </button>
                                                </template>
                                                <template
                                                    x-if="post.author_name === user.username && currentTab !== 'deleted'">
                                                    <button @click="startEditPost(post); open = false"
                                                        class="w-full text-left px-4 py-2 text-sm text-white hover:bg-white/10 flex items-center gap-2 transition-colors">
                                                        <span class="material-symbols-outlined text-sm">edit</span>
                                                        <span x-text="t('aoa.edit_post')"></span>
                                                    </button>
                                                </template>
                                                <template x-if="post.author_name === user.username">
                                                    <button @click="deletePost(post); open = false"
                                                        class="w-full text-left px-4 py-2 text-sm text-error hover:bg-error/10 flex items-center gap-2 transition-colors">
                                                        <span class="material-symbols-outlined text-sm"
                                                            x-text="currentTab === 'deleted' ? 'delete_forever' : 'delete'"></span>
                                                        <span
                                                            x-text="currentTab === 'deleted' ? t('aoa.delete_permanent') : t('aoa.delete_post')"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Post Content -->
                                <div class="pl-0 md:pl-16 flex flex-col gap-4">
                                    <!-- If this is a repost, show user's comment first -->
                                    <template x-if="post.reposted_post && post.content">
                                        <p class="font-body-lg text-body-lg text-white font-medium"
                                            x-html="formatPostContent(post.content)">
                                        </p>
                                    </template>

                                    <!-- Original Post Content (either direct or nested in repost) -->
                                    <div @click="post.reposted_post ? scrollToPost(post.reposted_post.id) : null"
                                        :class="post.reposted_post ? 'p-4 rounded-xl bg-white/5 border border-white/5 mt-2 cursor-pointer hover:bg-white/10 transition-all' : ''">
                                        <template x-if="post.reposted_post">
                                            <div class="flex items-center gap-2 mb-3">
                                                <div
                                                    class="w-6 h-6 rounded-full overflow-hidden border border-white/10">
                                                    <img referrerpolicy="no-referrer"
                                                        :src="getAuthorAvatar(post.reposted_post.author_name, post.reposted_post.author_avatar)"
                                                        @error="$el.src='https://lh3.googleusercontent.com/a/default-user'"
                                                        class="w-full h-full object-cover">
                                                </div>
                                                <span class="text-xs font-bold text-white/60"
                                                    x-text="getAuthorDisplayName(post.reposted_post.author_name, post.reposted_post.author_displayName)"></span>
                                            </div>
                                        </template>

                                        <template x-if="!post.isEditing">
                                            <p class="font-body-lg text-body-lg text-white/90 leading-relaxed"
                                                x-html="formatPostContent(post.reposted_post ? post.reposted_post.content : post.content)">
                                            </p>
                                        </template>

                                        <template x-if="post.isEditing">
                                            <div
                                                class="flex flex-col gap-3 w-full bg-white/5 border border-white/10 rounded-xl p-4 my-2">
                                                <textarea x-model="post.editContent"
                                                    class="w-full bg-transparent border-none p-0 text-sm text-white focus:outline-none placeholder:text-white/30 min-h-[80px] resize-none"
                                                    :placeholder="lang === 'vi' ? 'Sửa nội dung bài viết...' : 'Edit post content...'"></textarea>
                                                <div
                                                    class="flex items-center justify-end gap-2 border-t border-white/5 pt-3">
                                                    <button @click="post.isEditing = false"
                                                        class="px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-white/80 hover:text-white transition-all text-[14px] font-bold tracking-wider">
                                                        <span x-text="lang === 'vi' ? 'Hủy' : 'Cancel'"></span>
                                                    </button>
                                                    <button @click="saveEditPost(post)"
                                                        :disabled="!post.editContent || !post.editContent.trim()"
                                                        class="px-5 py-1.5 bg-[#fbbf24] text-black font-bold text-[14px] tracking-widest rounded-full hover:scale-105 hover:bg-[#fbbf24]/90 active:scale-95 transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center gap-1.5 shadow-[0_0_15px_rgba(255,215,0,0.2)]">
                                                        <span x-text="lang === 'vi' ? 'Lưu' : 'Save'"></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- Mini Mindmap -->
                                        <template
                                            x-if="(post.reposted_post ? post.reposted_post.graph_data : post.graph_data) && (post.reposted_post ? post.reposted_post.graph_data.nodes : post.graph_data.nodes) && (post.reposted_post ? post.reposted_post.graph_data.nodes.length > 0 : post.graph_data.nodes.length > 0)">
                                            <div>
                                                <!-- Khung giả giữ chỗ -->
                                                <div x-show="post.isFullscreen"
                                                    class="w-full aspect-video mt-4 border border-transparent"></div>

                                                <!-- Fullscreen Teleported Modal -->
                                                <template x-teleport="body">
                                                    <div x-show="post.isFullscreen" style="display: none;"
                                                        x-transition:enter="transition ease-out duration-300"
                                                        x-transition:enter-start="opacity-0 scale-95"
                                                        x-transition:enter-end="opacity-100 scale-100"
                                                        x-transition:leave="transition ease-in duration-200"
                                                        x-transition:leave-start="opacity-100 scale-100"
                                                        x-transition:leave-end="opacity-0 scale-95"
                                                        class="fixed top-0 right-0 bottom-0 left-0 md:left-64 z-[9999] bg-surface-container flex items-center justify-center transform origin-center">

                                                        <div :id="'graph-fs-' + (post.reposted_post ? 'repost-' + post.id : post.id)"
                                                            class="w-full h-full">
                                                        </div>

                                                        <button
                                                            @click.stop="post.isFullscreen = false; setTimeout(() => initPostGraph(post.reposted_post ? 'repost-' + post.id : post.id, JSON.parse(JSON.stringify(post.reposted_post ? post.reposted_post.graph_data : post.graph_data))), 300)"
                                                            class="absolute bottom-6 right-6 w-12 h-12 rounded-full bg-on-surface/10 hover:bg-on-surface/20 text-on-surface flex items-center justify-center transition-all z-[10000]  border border-on-surface/10 shadow-lg">
                                                            <span
                                                                class="material-symbols-outlined text-2xl">fullscreen_exit</span>
                                                        </button>
                                                    </div>
                                                </template>

                                                <!-- Normal Inline View -->
                                                <div x-show="!post.isFullscreen"
                                                    class="w-full aspect-video rounded-lg bg-black/40 border border-white/10 relative overflow-hidden group mt-4 transition-all duration-300">

                                                    <!-- Nút phóng to -->
                                                    <button
                                                        @click.stop="post.isFullscreen = true; setTimeout(() => initPostGraph('fs-' + (post.reposted_post ? 'repost-' + post.id : post.id), JSON.parse(JSON.stringify(post.reposted_post ? post.reposted_post.graph_data : post.graph_data))), 300)"
                                                        class="absolute bottom-4 right-4 w-10 h-10 rounded-full bg-on-surface/10 hover:bg-on-surface/20 text-on-surface flex items-center justify-center transition-all opacity-0 group-hover:opacity-100 z-20 ">
                                                        <span
                                                            class="material-symbols-outlined text-xl">fullscreen</span>
                                                    </button>

                                                    <div :id="'graph-' + (post.reposted_post ? 'repost-' + post.id : post.id)"
                                                        class="w-full h-full"
                                                        x-init="$nextTick(() => initPostGraph(post.reposted_post ? 'repost-' + post.id : post.id, post.reposted_post ? post.reposted_post.graph_data : post.graph_data))">
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <!-- Interactions -->
                                <div class="pl-0 md:pl-16 mt-2">
                                    <!-- Stats Row -->
                                    <div class="flex items-center justify-between pb-3 px-1">
                                        <div class="flex items-center gap-1.5 text-white/60 text-xs font-medium cursor-pointer hover:text-white transition-colors"
                                            @click="likePost(post)">
                                            <div
                                                class="flex items-center justify-center w-5 h-5 rounded-full bg-[#fbbf24]/20">
                                                <span
                                                    class="material-symbols-outlined text-[#fbbf24] text-[14px] filled">favorite</span>
                                            </div>
                                            <span x-text="post.likes || 0"></span>
                                        </div>
                                        <div
                                            class="flex items-center gap-3 text-white/50 text-xs hover:text-white/80 transition-colors">
                                            <span class="cursor-pointer" @click="toggleComments(post)">
                                                <span x-text="post.comments ? post.comments.length : 0"></span>
                                                <span x-text="lang === 'vi' ? 'bình luận' : 'comments'"></span>
                                            </span>
                                            <span class="text-white/20 select-none">•</span>
                                            <span class="cursor-pointer" @click="savePost(post)">
                                                <span x-text="post.saved_by ? post.saved_by.length : 0"></span>
                                                <span x-text="lang === 'vi' ? 'lượt chia sẻ' : 'shares'"></span>
                                            </span>
                                        </div>
                                    </div>

                                    <!-- Action Buttons Row -->
                                    <div class="flex items-center justify-between gap-1 pt-1 border-t border-white/10">
                                        <button @click="likePost(post)"
                                            class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-white/60 hover:bg-white/5 hover:text-white transition-all group active:scale-95"
                                            :class="post.liked ? '!text-[#fbbf24]' : ''">
                                            <span
                                                class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform"
                                                :class="post.liked ? 'filled' : ''">favorite</span>
                                            <span class="text-xs font-bold hidden sm:inline"
                                                x-text="post.liked ? (lang === 'vi' ? 'Đã thích' : 'Liked') : (lang === 'vi' ? 'Thích' : 'Like')"></span>
                                        </button>

                                        <button @click="toggleComments(post)"
                                            class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-white/60 hover:bg-white/5 hover:text-white transition-all group active:scale-95"
                                            :class="post.showComments ? '!text-[#fbbf24] bg-[#fbbf24]/5' : ''">
                                            <span
                                                class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform"
                                                :class="post.showComments ? 'filled' : ''">chat_bubble</span>
                                            <span class="text-xs font-bold hidden sm:inline"
                                                x-text="lang === 'vi' ? 'Bình luận' : 'Comment'"></span>
                                        </button>

                                        <button @click="savePost(post)"
                                            class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-white/60 hover:bg-white/5 hover:text-white transition-all group active:scale-95"
                                            :class="post.saved ? '!text-[#fbbf24]' : ''">
                                            <span
                                                class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform"
                                                :class="post.saved ? 'filled' : ''">repeat</span>
                                            <span class="text-xs font-bold hidden sm:inline"
                                                x-text="post.saved ? (lang === 'vi' ? 'Đã chia sẻ' : 'Shared') : (lang === 'vi' ? 'Chia sẻ' : 'Share')"></span>
                                        </button>
                                    </div>
                                </div>

                                <!-- Comments Section -->
                                <template x-if="post.showComments">
                                    <div class="pl-0 md:pl-16 flex flex-col gap-4 mt-4 animate-fade-in">
                                        <div class="flex flex-col gap-4 max-h-64 overflow-y-auto pr-2">
                                            <template x-for="cmt in post.comments">
                                                <div class="flex gap-3 bg-white/5 p-3 rounded-lg border border-white/5">
                                                    <img referrerpolicy="no-referrer"
                                                        :src="getAuthorAvatar(cmt.author_name, cmt.author_avatar)"
                                                        @error="$el.src='https://lh3.googleusercontent.com/a/default-user'"
                                                        class="w-8 h-8 rounded-full shrink-0">
                                                    <div class="flex flex-col">
                                                        <div class="flex items-center gap-2">
                                                            <span class="text-xs font-bold text-white"
                                                                x-text="getAuthorDisplayName(cmt.author_name, cmt.author_displayName)"></span>
                                                            <span class="text-[11px] text-on-surface-variant"
                                                                x-text="formatDateTime(cmt.timestamp)"></span>
                                                        </div>
                                                        <p class="text-sm text-white/80 mt-1"
                                                            x-html="formatPostContent(cmt.content)"></p>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Comment Input -->
                                        <div class="flex gap-3 items-center mt-2">
                                            <input x-model="post.newComment" @keyup.enter="addComment(post)" type="text"
                                                class="flex-1 bg-white/10 border border-white/10 rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-[#fbbf24]"
                                                placeholder="Viết bình luận...">
                                            <button @click="addComment(post)"
                                                class="text-[#fbbf24] hover:scale-110 transition-transform">
                                                <span class="material-symbols-outlined">send</span>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </article>
                        </template>

                        <!-- Infinite Scroll Trigger -->
                        <div x-show="hasMore" x-intersect.margin.200px="loadMore()"
                            class="py-12 flex flex-col items-center justify-center gap-4 transition-all duration-500">
                            <template x-if="loadingMore">
                                <div class="flex flex-col items-center gap-3">
                                    <div
                                        class="w-10 h-10 border-4 border-[#fbbf24]/20 border-t-[#fbbf24] rounded-full animate-spin">
                                    </div>
                                    <span
                                        class="text-[14px] font-bold tracking-[0.3em] text-[#fbbf24] animate-pulse"
                                        x-text="t('aoa.loading_more')">Đang
                                        tải thêm...</span>
                                </div>
                            </template>
                            <template x-if="!loadingMore">
                                <div
                                    class="h-10 w-px bg-gradient-to-b from-[#fbbf24]/0 via-[#fbbf24]/20 to-[#fbbf24]/0">
                                </div>
                            </template>
                        </div>

                        <!-- End of Feed Message -->
                        <template x-if="!hasMore && filteredPosts().length > 0">
                            <div class="py-16 flex flex-col items-center justify-center gap-4 opacity-40">
                                <span class="material-symbols-outlined text-4xl">auto_awesome</span>
                                <p class="text-[14px] font-medium tracking-widest"
                                    x-text="t('aoa.no_more_posts')">Bạn đã xem hết bài viết</p>
                                <div class="w-12 h-px bg-white/20"></div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>

        <!-- Global Glassmorphism Toast -->
        <div x-show="showToast" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-y-10"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform translate-y-0"
            x-transition:leave-end="opacity-0 transform translate-y-10"
            class="fixed bottom-24 lg:bottom-10 right-6 z-[9999] flex items-center gap-3 px-5 py-3.5 rounded-2xl border shadow-[0_8px_30px_rgba(0,0,0,0.4)]  !text-white text-white dark:text-[#86efac] dark:text-[#ffb4ab] dark:text-[#fbbf24]"
            :class="toastType === 'success' ? 'bg-[#064e3b]/90 border-[#4ade80]/50 dark:!text-[#86efac]' : (toastType === 'error' ? 'bg-[#450a0a]/90 border-[#ffb4ab]/50 dark:!text-[#ffb4ab]' : 'bg-[#161b22]/90 border-[#ffe16d]/40 dark:!text-[#fbbf24]')"
            style="display: none;">
            <span class="material-symbols-outlined text-[21px]" style="color: inherit;"
                x-text="toastType === 'success' ? 'check_circle' : (toastType === 'error' ? 'error' : 'info')"></span>
            <span class="font-bold text-[15px]" style="color: inherit;" x-text="toastMessage"></span>
        </div>
    </main>

    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script>
        function aoaApp() {
            return {
                posts: [],
                pageLoading: true,
                currentTab: 'community',
                activeHashtag: '',
                previousTab: 'trending',
                lang: window.currentLang || 'vi',
                newPostContent: '',
                newPostPrivacy: 'public',
                publishingNewPost: false,
                t(key) {
                    const _ = this.lang; // Force reactive dependency in Alpine.js
                    return window.t(key);
                },
                user: JSON.parse(localStorage.getItem('thapsang_user') || '{}'),
                globalModal: { show: false, title: '', message: '' },
                reportModal: { show: false, post: null, category: '', details: '' },
                displayedCount: 5,
                hasMore: true,
                loadingMore: false,
                searchQuery: '',
                trendingData: { ai_trends: [], hashtags: [], coaches: [], summary: '' },
                viewingUser: null,
                loadingTrending: true,
                showEditProfile: false,
                coachSortOption: 'influence',
                coachSearchQuery: '',
                selectedCoachTag: 'all',
                editName: '',
                editBio: '',
                profileTab: 'posts',
                mindset: { radar_stats: [], dims: [], keywords: [], analysis_text: '', mbti_suggestions: [] },
                animatedStats: [0, 0, 0, 0, 0, 0],
                showZoomedMindset: false,
                mindsetLoading: false,
                mindsetLoaded: false,
                
                showVoiceList: false,
                availableVoices: [
                    { id: "2cdb394d-a705-4cab-9fe0-6ee5ddf0a66f", name: "Mia Garcia", lang: "en", gender: "female", preview_url: "https://thapsang.digiforce.vn/storage/uploads/mia_garcia-s848kq.wav" },
                    { id: "a7a3911f-f3cf-4b9c-a2bb-16e53bba6c15", name: "Colton Brooks", lang: "en", gender: "male", preview_url: "https://thapsang.digiforce.vn/storage/uploads/colton_brooks-ysnqzk.wav" },
                    { id: "066ac6f6-48c2-4531-b830-fe4db5f73dd0", name: "Minh Kha", lang: "vi", gender: "male", preview_url: "https://thapsang.digiforce.vn/storage/uploads/minh_kha-o7qbbs.wav" },
                    { id: "57aa9411-124c-476c-8fed-662ef2e49779", name: "Mai Chi", lang: "vi", gender: "female", preview_url: "https://thapsang.digiforce.vn/storage/uploads/mai_chi-1q6xuz.wav" }
                ],

                    }
                },
                animateRadar(targetStats) {
                    const duration = 1000; // 1s snap and spring
                    const start = performance.now();
                    const startStats = [...this.animatedStats];

                    // JoJo style dramatic bounce (easeOutBack)
                    const easeOutBack = t => {
                        const c1 = 1.2; // Slightly tuned overshoot to look organic
                        const c3 = c1 + 1;
                        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
                    };

                    const step = (timestamp) => {
                        const elapsed = timestamp - start;
                        const progress = Math.min(elapsed / duration, 1);
                        const ease = easeOutBack(progress);

                        this.animatedStats = startStats.map((startVal, i) => {
                            const targetVal = targetStats[i] || 0;
                            const newVal = startVal + (targetVal - startVal) * ease;
                            // Clamp values to prevent weird negative sizes at beginning of ease
                            return Math.max(0, Math.round(newVal));
                        });

                        if (progress < 1) {
                            requestAnimationFrame(step);
                        }
                    };
                    requestAnimationFrame(step);
                },
                renderRadarSVG() {
                    const _ = this.themeKey; // Establish reactivity to theme changes
                    const _l = this.langKey; // Establish reactivity to language changes
                    const cx = 240, cy = 210, R = 140;
                    const rawDims = this.mindset.dims?.length ? this.mindset.dims
                        : ['Khách quan', 'Cảm xúc', 'Tiêu cực', 'Tích cực', 'Sáng tạo', 'Tổng quan'];

                    const dims = rawDims.map(d => {
                        const keyMap = {
                            'Khách quan': window.t('aoa.dim_objective') || 'Khách quan',
                            'Cảm xúc': window.t('aoa.dim_emotion') || 'Cảm xúc',
                            'Tiêu cực': window.t('aoa.dim_negative') || 'Tiêu cực',
                            'Tích cực': window.t('aoa.dim_positive') || 'Tích cực',
                            'Sáng tạo': window.t('aoa.dim_creativity') || 'Sáng tạo',
                            'Tổng quan': window.t('aoa.dim_overview') || 'Tổng quan'
                        };
                        return keyMap[d] || d;
                    });
                    const stats = this.animatedStats?.length ? this.animatedStats
                        : [0, 0, 0, 0, 0, 0];
                    const n = 6;

                    const isLight = !document.documentElement.classList.contains('dark');
                    const mainColor = isLight ? '#2563eb' : '#fbbf24'; // tailwind blue-600
                    const bgColor = isLight ? 'rgba(37, 99, 235, 0.04)' : 'rgba(255,215,0,0.04)';
                    const gridColor = isLight ? 'rgba(22, 32, 97, 0.1)' : 'rgba(255,255,255,0.06)';
                    const axisColor = isLight ? 'rgba(22, 32, 97, 0.08)' : 'rgba(255,255,255,0.05)';
                    const pointBg = isLight ? '#ffffff' : '#000000';
                    const textColor = isLight ? '#162061' : 'rgba(255,255,255,0.75)';
                    const valColor = isLight ? '#2563eb' : '#fbbf24';

                    // Helpers
                    const pt = (r, i) => {
                        const a = -Math.PI / 2 + i * 2 * Math.PI / n;
                        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
                    };
                    const poly = (r, attr = '') => {
                        const pts = Array.from({ length: n }, (_, i) => pt(r, i).join(',')).join(' ');
                        return `<polygon points="${pts}" ${attr}/>`;
                    };

                    let svg = `<defs>
                        <radialGradient id="rg" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="${mainColor}" stop-opacity="0.28"/>
                            <stop offset="100%" stop-color="${mainColor}" stop-opacity="0.04"/>
                        </radialGradient></defs>`;

                    // Glow bg
                    svg += `<circle cx="${cx}" cy="${cy}" r="${R + 10}" fill="${bgColor}"/>`;

                    // Grid rings (4 levels)
                    for (let lv = 1; lv <= 4; lv++) {
                        svg += poly(R * (lv / 4), `fill="none" stroke="${gridColor}" stroke-width="1"`);
                    }
                    // Axes
                    for (let i = 0; i < n; i++) {
                        const [x, y] = pt(R, i);
                        svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${axisColor}" stroke-width="1"/>`;
                    }

                    // Data polygon
                    const dataPts = stats.map((v, i) => pt(R * (Math.min(v, 100) / 100), i));
                    svg += `<polygon points="${dataPts.map(p => p.join(',')).join(' ')}" fill="url(#rg)" stroke="${mainColor}" stroke-width="2.5" stroke-linejoin="round"/>`;

                    // Vertices + score labels (offset radially outward to avoid overlap)
                    dataPts.forEach(([x, y], i) => {
                        svg += `<circle cx="${x}" cy="${y}" r="5" fill="${pointBg}" stroke="${mainColor}" stroke-width="2.2" filter="drop-shadow(0 0 3px ${mainColor})"/>`;

                        const val = stats[i];
                        const offsetR = R * (Math.min(val, 100) / 100) + 14;
                        const [lx, ly] = pt(offsetR, i);

                        const anchor = Math.abs(Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n)) < 0.1 ? 'middle'
                            : Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n) > 0 ? 'start' : 'end';
                        const dy = i === 0 ? -4 : (i === 3 ? 12 : 4);

                        svg += `<text x="${lx}" y="${ly + dy}" text-anchor="${anchor}" font-family="Inter" font-size="11" fill="${valColor}" font-weight="bold">${Math.round(val)}</text>`;
                    });

                    // Dimension labels (outside)
                    const labelOffsets = [{ dx: 0, dy: -20 }, { dx: 24, dy: -10 }, { dx: 24, dy: 10 }, { dx: 0, dy: 20 }, { dx: -24, dy: 10 }, { dx: -24, dy: -10 }];
                    dims.forEach((d, i) => {
                        const [x, y] = pt(R + 38, i);
                        const anchor = Math.abs(Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n)) < 0.1 ? 'middle'
                            : Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n) > 0 ? 'start' : 'end';
                        const fill = i === 0 ? mainColor : textColor;
                        const weight = i === 0 ? 'bold' : '600';
                        svg += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-family="Inter" font-size="13" fill="${fill}" font-weight="${weight}">${d}</text>`;
                    });

                    return svg;
                },
                async syncTextProfile() {

                    if (!this.user.username) return false;

                async syncImageToBackend(field, value) {

                },
                compressImage(dataURL, maxWidth = 800, quality = 0.80) {
                    // Nén ảnh xuống maxWidth px và giảm chất lượng để tránh base64 quá lớn
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxWidth) {
                                h = Math.round(h * maxWidth / w);
                                w = maxWidth;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.onerror = () => resolve(dataURL); // fallback nếu lỗi
                        img.src = dataURL;
                    });
                },
                async refreshProfileFromBackend() {

                getFollowersCount(targetName) {

                    // Strictly based on follow actions.

                    // If viewing someone else, they have 1 follower if YOU follow them, otherwise 0.
                    if (!isMe) {

                getFollowingCount(targetName) {
                    const name = targetName || this.user.username;
                    const isMe = name === this.user.username;

                    // For the logged-in user, use the real following list
                    if (isMe) return (this.user.following_list || []).length;

                    // For others, calculate based on who they have 'engaged' with (liked)
                    const likedPosts = this.posts.filter(p => p.liked_by && p.liked_by.includes(name));
                    const authors = new Set();
                    likedPosts.forEach(p => {
                        if (p.author_name !== name) authors.add(p.author_name);

                    // Return real engagement count or a small active base

                },

                authorProfilesCache: {},

                getAuthorDisplayName(name, fallback) {
                    if (!name) return fallback || "Unknown User";

                    const clean = (val) => {
                        if (!val) return "";
                        return val.includes("@") ? val.split("@")[0] : val;
                    };

                    if (this.authorProfilesCache[name]) {
                        const dName = this.authorProfilesCache[name].displayName;
                        if (dName && !dName.includes("@")) return dName;
                    }
                    if (name === this.user.username) {
                        const dName = this.user.displayName;
                        if (dName && !dName.includes("@")) return dName;
                    }
                    if (this.trendingData && this.trendingData.coaches) {
                        const coachInfo = this.trendingData.coaches.find(c => c.handle === name);
                        if (coachInfo && coachInfo.name) {
                            const cName = coachInfo.name;
                            return cName.includes("@") ? clean(cName) : cName;
                        }
                    }

                    // Trigger async fetch if not cached
                    if (this.authorProfilesCache[name] === undefined) {
                        this.authorProfilesCache[name] = null; // mark as fetching
                        this.loadAuthorProfile(name);
                    }

                    return (fallback && !fallback.includes("@")) ? fallback : clean(name);
                },
                getAuthorAvatar(name, originalAvatar) {
                    if (name === this.user.username && this.user.avatar) {
                        return this.user.avatar;
                    }
                    if (this.authorProfilesCache[name] && this.authorProfilesCache[name].avatar) {
                        return this.authorProfilesCache[name].avatar;
                    }
                    return originalAvatar || 'https://lh3.googleusercontent.com/a/default-user';
                },
                handleAvatarUpload(e) {

                    reader.onload = async (f) => {

                        window.dispatchEvent(new CustomEvent('user-updated', { detail: { ...this.user } }));
                        // Chỉ gửi riêng trường avatar — không gửi banner cùng lúc
                        await this.syncImageToBackend('avatar', compressed);

                    reader.readAsDataURL(file);

                async init() {
                    this.pageLoading = true;
                    document.body.classList.add('overflow-hidden');
                    this.$watch('pageLoading', (val) => {
                        if (val) {
                            document.body.classList.add('overflow-hidden');
                        } else {
                            document.body.classList.remove('overflow-hidden');
                        }
                    });

                    window.addEventListener('user-updated', (e) => {
                        this.user = e.detail;
                    });

                    window.addEventListener('ts-lang-changed', (e) => {
                        this.lang = e.detail.lang;
                    });
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'thapsang_lang') {
                            this.lang = e.newValue || 'vi';
                        }
                    });

                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('tab') === 'mine') {
                        this.currentTab = 'mine';
                    }

                    this.$watch('currentTab', () => {
                        this.displayedCount = 5;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });

                    // Luôn đồng bộ profile từ backend khi trang load để đảm bảo data mới nhất
                    await this.refreshProfileFromBackend();

                    // Fetch Trending Data concurrent promise
                    this.loadingTrending = true;
                    const trendingPromise = fetch('/api/v1/aoa/trending')
                        .then(r => r.json())
                        .then(data => {
                            this.trendingData = {
                                ai_trends: data.ai_trends || [],
                                hashtags: data.hashtags || [],
                                coaches: data.coaches || [],
                                summary: data.summary || ''
                            };
                        })
                        .catch(e => console.error("Trending fetch error", e))
                        .finally(() => this.loadingTrending = false);

                    // Fetch Posts Data concurrent promise
                    const postsPromise = (async () => {
                        try {
                            const res = await fetch('/api/v1/aoa/posts');
                            const data = await res.json();
                            const combinedPosts = this.getPostsWithOptimistic(data.posts || []);
                            this.posts = combinedPosts.map(p => ({
                                ...p,
                                showComments: false,
                                newComment: '',
                                liked: p.liked_by ? p.liked_by.includes(this.user.username) : false,
                                saved: p.saved_by ? p.saved_by.includes(this.user.username) : false,
                                overlay: { show: false, title: '', message: '', type: 'info', onConfirm: null },
                                isFullscreen: false,
                                isEditing: false,
                                editContent: ''
                            }));
                        } catch (e) {
                            console.error("Failed to fetch posts", e);
                        }
                    })();

                    // Chỉ chờ posts hoàn tất để load trang nhanh, trending chạy ngầm
                    await postsPromise;

                    // Trì hoãn nhẹ 400ms để hiệu ứng loading chuyển trang mượt mà

                showPostOverlay(post, title, message, type = 'info', onConfirm = null) {
                    post.overlay = { show: true, title, message, type, onConfirm };
                },
                filteredPosts() {
                    const username = this.user ? this.user.username : null;
                    let list = [...this.posts];

                    // Search Filter
                    if (this.searchQuery && this.searchQuery.trim()) {
                        const removeAccents = (str) => {
                            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
                        };

                        const rawQuery = removeAccents(this.searchQuery).toLowerCase();
                        const queryTerms = rawQuery.split(/\s+/).filter(Boolean);
                        const spacelessQuery = rawQuery.replace(/\s+/g, '');

                        list = list.filter(post => {
                            const titleStr = typeof post.title === 'string' ? post.title : '';
                            const contentStr = typeof post.content === 'string' ? post.content : JSON.stringify(post.content || '');
                            const authorStr = typeof post.author_name === 'string' ? post.author_name : '';

                            const searchableText = removeAccents(`${titleStr} ${contentStr} ${authorStr}`).toLowerCase();
                            const spacelessText = searchableText.replace(/\s+/g, '');

                            // Tìm kiếm theo từng từ (nếu có khoảng trắng) HOẶC tìm kiếm toàn bộ chuỗi viết liền (để "hokhoa" vẫn ra "Hồ Khoa")
                            return queryTerms.every(term => searchableText.includes(term)) || spacelessText.includes(spacelessQuery);
                        });
                    }

                    // Privacy visibility helper
                    const canUserSeePost = (p) => {
                        const isAuthor = p.author_name === username;
                        if (isAuthor) return true;
                        const privacy = p.post_privacy || 'public';
                        if (privacy === 'public') {
                            return true;
                        } else if (privacy === 'followers') {
                            return this.isFollowing(p.author_name);
                        } else if (privacy === 'private') {
                            return false;
                        }
                        return true;
                    };

                    if (this.currentTab === 'community') {
                        // Show all except hidden or deleted by current user or having hidden/deleted status
                        list = list.filter(p =>
                            (!p.hidden_by || !p.hidden_by.includes(username)) &&
                            (!p.deleted_by || !p.deleted_by.includes(username)) &&
                            p.post_status !== 'hidden' &&
                            p.post_status !== 'deleted' &&
                            canUserSeePost(p)
                        );
                    } else if (this.currentTab === 'trending') {
                        // Show all except hidden/deleted, but sort by engagement
                        list = list.filter(p =>
                            (!p.hidden_by || !p.hidden_by.includes(username)) &&
                            (!p.deleted_by || !p.deleted_by.includes(username)) &&
                            p.post_status !== 'hidden' &&
                            p.post_status !== 'deleted' &&
                            canUserSeePost(p)
                        );
                        // Sort by engagement: likes + comments
                        list.sort((a, b) => (b.likes + b.comments.length) - (a.likes + a.comments.length));
                    } else if (this.currentTab === 'mine') {
                        // Show my posts except deleted, include saved
                        list = list.filter(p =>
                            (p.author_name === username || (p.saved_by && p.saved_by.includes(username))) &&
                            (!p.deleted_by || !p.deleted_by.includes(username)) &&
                            p.post_status !== 'deleted'
                        );
                    } else if (this.currentTab === 'profile') {
                        // Show profile posts respecting privacy
                        list = list.filter(p =>
                            p.author_name === this.viewingUser.username &&
                            (!p.deleted_by || !p.deleted_by.includes(username)) &&
                            p.post_status !== 'deleted' &&
                            canUserSeePost(p)
                        );
                    } else if (this.currentTab === 'hidden') {
                        list = list.filter(p =>
                            ((p.hidden_by && p.hidden_by.includes(username)) || p.post_status === 'hidden') &&
                            (!p.deleted_by || !p.deleted_by.includes(username)) &&
                            p.post_status !== 'deleted'
                        );
                    } else if (this.currentTab === 'deleted') {
                        list = list.filter(p =>
                            (p.deleted_by && p.deleted_by.includes(username)) || p.post_status === 'deleted'
                        );
                    } else if (this.currentTab === 'hashtag') {
                        const lowerTag = this.activeHashtag.toLowerCase();
                        list = list.filter(p => {
                            const c = p.content ? p.content.toLowerCase() : '';
                            const rc = p.reposted_post && p.reposted_post.content ? p.reposted_post.content.toLowerCase() : '';
                            return c.includes(lowerTag) || rc.includes(lowerTag);
                        });
                    }

                    let sortedList = [];
                    if (this.currentTab === 'trending') {
                        // Engagement sorting was already done above
                        sortedList = list;
                    } else {
                        // Sort by timestamp descending (newest first)
                        sortedList = list.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    }

                    // Update hasMore status
                    this.hasMore = this.displayedCount < sortedList.length;

                    return sortedList.slice(0, this.displayedCount);
                },

                    }, 600);

                likePost(post) {

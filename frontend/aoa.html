                formatPostContent(content) {
                    if (typeof content === 'object' && !content.nodes) {
                        content = content['vi'] || content['en'] || '';
                    } else if (typeof content === 'string') {
                        // Keep string as is
                    } else {
                        content = '';
                    }
                    if (!content) return '';
                    // Escape HTML
                    let escaped = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                    // 1. Handle delimited hashtags [[#hashtag with spaces]]
                    escaped = escaped.replace(/\[\[(#[^\]]+)\]\]/g, '<span class="text-blue-400 font-bold cursor-pointer hover:underline" onclick="window.dispatchEvent(new CustomEvent(\'hashtag-click\', {detail: \'$1\'}))">$1</span>');

                    // 2. Handle regular hashtags #word, but avoid ones already inside a span
                    // We use a regex that matches either an existing span OR a hashtag
                    return escaped.replace(/(<span[^>]*>.*?<\/span>)|(#[a-zA-Z0-9_À-ỹ]+)/g, (match, p1, p2) => {
                        if (p1) return p1; // If it's a span, return it as is
                        return `<span class="text-blue-400 font-bold cursor-pointer hover:underline" onclick="window.dispatchEvent(new CustomEvent('hashtag-click', {detail: '${p2}'}))">${p2}</span>`;
                    });
                },
                addComment(post) {
                    const commentText = post.newComment;
                    if (!commentText || !commentText.trim()) return;

                    const originalComments = [...post.comments];
                    const tempComment = {
                        author_name: this.user.username,
                        author_displayName: this.user.displayName || this.user.username,
                        author_avatar: this.user.avatar || "",
                        content: commentText,
                        timestamp: this.lang === 'vi' ? 'Đang gửi...' : 'Sending...'
                    };

                    post.comments.push(tempComment);
                    post.newComment = '';

                    fetch(`/api/v1/aoa/posts/${post.id}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            author_name: this.user.username,
                            author_displayName: this.user.displayName || this.user.username,
                            author_avatar: this.user.avatar || "",
                            content: commentText
                        })
                    })
                        .then(res => {
                            if (!res.ok) throw new Error("Comment failed");
                            return res.json();
                        })
                        .then(data => {
                            post.comments = data.comments;
                        })
                        .catch(e => {
                            console.warn("[Comment Optimistic Rollback]", e);
                            post.comments = originalComments;
                            post.newComment = commentText;
                            alert(this.lang === 'vi' ? 'Không thể gửi bình luận. Vui lòng kiểm tra kết nối.' : 'Failed to send comment. Please check connection.');
                        });
                },
                sortedCoaches() {
                    let list = [...(this.trendingData.coaches || [])];
                    if (this.coachSortOption === 'influence') {
                        // Original order from API
                        return list;
                    } else if (this.coachSortOption === 'engagement') {
                        // Engagement metric = simulated likes + tags bonus
                        return list.sort((a, b) => {
                            const scoreA = (a.followers || 0) * 0.15 + ((a.tags || []).length * 90);
                            const scoreB = (b.followers || 0) * 0.15 + ((b.tags || []).length * 90);
                            return scoreB - scoreA;
                        });
                    } else if (this.coachSortOption === 'followers') {
                        // Popularity = followers descending
                        return list.sort((a, b) => (b.followers || 0) - (a.followers || 0));
                    } else if (this.coachSortOption === 'name') {
                        // Alphabetical = name A-Z
                        return list.sort((a, b) => a.name.localeCompare(b.name));
                    }
                    return list;
                },
                trendingPosts() {
                    const username = this.user ? this.user.username : null;
                    const canUserSeePost = (p) => {
                        const isAuthor = p.author_name === username;
                        if (isAuthor) return true;
                        const privacy = p.post_privacy || 'public';
                        if (privacy === 'public') {
                            return true;
                        } else if (privacy === 'followers') {
                            return this.isFollowing(p.author_name);
                        } else if (privacy === 'private') {
                            return false;
                        }
                        return true;
                    };
                    return [...this.posts]
                        .filter(p => {
                            if (p.post_status === 'hidden' || p.post_status === 'deleted') return false;
                            if (p.hidden_by && p.hidden_by.includes(username)) return false;
                            if (p.deleted_by && p.deleted_by.includes(username)) return false;
                            return canUserSeePost(p);
                        })
                        .sort((a, b) => {
                            const scoreA = (a.likes || 0) + (a.comments ? a.comments.length : 0);
                            const scoreB = (b.likes || 0) + (b.comments ? b.comments.length : 0);
                            return scoreB - scoreA;
                        })
                        .slice(0, 3);
                },
                scrollToPost(postId) {
                    const username = this.user.username;
                    const canUserSeePost = (p) => {
                        const isAuthor = p.author_name === username;
                        if (isAuthor) return true;
                        const privacy = p.post_privacy || 'public';
                        if (privacy === 'public') {
                            return true;
                        } else if (privacy === 'followers') {
                            return this.isFollowing(p.author_name);
                        } else if (privacy === 'private') {
                            return false;
                        }
                        return true;
                    };

                    // 1. Clear search query to make sure the target post isn't hidden
                    this.searchQuery = '';

                    // 2. Switch tab to community feed
                    this.currentTab = 'community';

                    // 3. Find the post's index in the fully filtered and sorted community list
                    let sortedList = [...this.posts].filter(p =>
                        (!p.hidden_by || !p.hidden_by.includes(username)) &&
                        (!p.deleted_by || !p.deleted_by.includes(username)) &&
                        p.post_status !== 'hidden' &&
                        p.post_status !== 'deleted' &&
                        canUserSeePost(p)
                    );
                    // Sort by newest timestamp descending
                    sortedList.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    const postIndex = sortedList.findIndex(p => String(p.id) === String(postId));
                    if (postIndex !== -1) {
                        // Expand the rendered post count if target is beyond current slice limit
                        if (postIndex >= this.displayedCount) {
                            this.displayedCount = postIndex + 1;
                        }
                    }

                    // 4. Yield briefly to browser event loop to let Alpine flush all DOM updates
                    setTimeout(() => {
                        const target = document.getElementById('post-' + postId);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            target.classList.add('glass-panel-active');
                            setTimeout(() => target.classList.remove('glass-panel-active'), 2500);
                        } else {
                            console.warn(`Post with ID ${postId} not found in DOM.`);
                        }
                    }, 50);
                },
                savePost(post) {
                    // Hiển thị giao diện Chia sẻ thay vì lưu đơn thuần
                    post.repostComment = '';
                    this.showPostOverlay(post, this.t('aoa.share_post_title'), "", 'repost');
                },
                confirmRepost(post) {
                    // Cập nhật giao diện ngay lập tức (Optimistic UI update)
                    post.overlay.show = false;
                    const contentToShare = post.repostComment;
                    post.repostComment = '';

                    // Hiển thị thông báo thành công ngay lập tức
                    this.globalModal = {
                        show: true,
                        title: this.t('aoa.shared_success_title'),
                        message: this.t('aoa.shared_success_desc')
                    };

                    // Cập nhật lượt chia sẻ nội bộ
                    if (!post.saved_by) post.saved_by = [];
                    if (!post.saved_by.includes(this.user.username)) {
                        post.saved_by.push(this.user.username);
                        post.saved = true;
                    }

                    // Chạy tác vụ fetch ngầm (không dùng await)
                    fetch('/api/v1/aoa/posts/repost', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            author_name: this.user.username,
                            author_displayName: this.user.displayName || this.user.username,
                            author_avatar: this.user.avatar || "",
                            content: contentToShare,
                            original_post_id: post.id
                        })
                    })
                        .then(res => {
                            if (res.ok) {
                                // Tải lại bài viết ngầm để hiển thị trong trang cá nhân
                                this.refreshPostsOnly();
                            }
                        })
                        .catch(e => console.error("Lỗi khi share ngầm:", e));
                },
                hidePost(post) {
                    const isHidden = (post.hidden_by && post.hidden_by.includes(this.user.username)) || post.post_status === 'hidden';
                    const title = isHidden ? this.t('aoa.unhide_post') : this.t('aoa.hide_post');
                    const message = isHidden ? this.t('aoa.unhide_post_msg') : this.t('aoa.hide_post_msg');

                    this.showPostOverlay(post, title, message, 'confirm', () => {
                        post.overlay.show = false;

                        if (!post.hidden_by) post.hidden_by = [];
                        const isCurrentlyHidden = post.hidden_by.includes(this.user.username) || post.post_status === 'hidden';

                        if (isCurrentlyHidden) {
                            post.hidden_by = post.hidden_by.filter(u => u !== this.user.username);
                            post.post_status = 'active';
                        } else {
                            if (!post.hidden_by.includes(this.user.username)) {
                                post.hidden_by.push(this.user.username);
                            }
                            post.post_status = 'hidden';
                        }
                        // Trigger reactivity
                        this.posts = [...this.posts];

                        fetch(`/api/v1/aoa/posts/${post.id}/hide?username=${this.user.username}`, {
                            method: 'POST'
                        }).catch(e => console.error(e));
                    });
                },
                reportPost(post) {
                    this.reportModal = {
                        show: true,
                        post: post,
                        category: '',
                        details: ''
                    };
                },
                submitReport() {
                    const post = this.reportModal.post;
                    const category = this.reportModal.category;
                    const details = this.reportModal.details;

                    this.reportModal.show = false;

                    // Optimistic update
                    this.globalModal = {
                        show: true,
                        title: this.lang === 'vi' ? 'Thành công' : 'Success',
                        message: this.lang === 'vi' ? 'Cảm ơn bạn đã báo cáo. Chúng tôi sẽ xem xét bài viết này.' : 'Thank you for reporting. We will review this post.'
                    };

                    // Background fetch
                    fetch(`/api/v1/aoa/posts/${post.id}/report`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: this.user.username,
                            category: category,
                            details: details
                        })
                    }).catch(e => console.error(e));
                },
                async deletePost(post) {
                    const isDeletedView = this.currentTab === 'deleted';
                    const title = isDeletedView ? this.t('aoa.delete_permanent') : this.t('aoa.delete_confirm');
                    const message = isDeletedView ? this.t('aoa.delete_permanent_msg') : this.t('aoa.delete_confirm_msg');

                    this.showPostOverlay(
                        post,
                        title,
                        message,
                        'confirm',
                        () => {
                            post.overlay.show = false;

                            if (isDeletedView) {
                                this.posts = this.posts.filter(p => p.id !== post.id);
                            } else {
                                if (!post.deleted_by) post.deleted_by = [];
                                post.deleted_by.push(this.user.username);
                                post.post_status = 'deleted';
                                this.posts = [...this.posts];
                            }

                            const url = `/api/v1/aoa/posts/${post.id}?username=${this.user.username}${isDeletedView ? '&permanent=true' : ''}`;
                            fetch(url, {
                                method: 'DELETE'
                            }).catch(e => console.error(e));
                        }
                    );
                },
                async restorePost(post) {
                    try {
                        const res = await fetch(`/api/v1/aoa/posts/${post.id}/restore?username=${this.user.username}`, {
                            method: 'POST'
                        });
                        if (res.ok) {
                            // Clear deleted status
                            if (post.deleted_by) {
                                post.deleted_by = post.deleted_by.filter(u => u !== this.user.username);
                            }
                            // Also clear hidden status so it definitely reappears on main feed
                            if (post.hidden_by) {
                                post.hidden_by = post.hidden_by.filter(u => u !== this.user.username);
                            }
                            post.post_status = 'active';

                            this.posts = [...this.posts];
                            this.globalModal = {
                                show: true,
                                title: this.t('aoa.restored_title'),
                                message: this.t('aoa.restored_msg')
                            };
                        }
                    } catch (e) { console.error(e); }
                },
                startEditPost(post) {
                    post.editContent = typeof post.content === 'object' ? (post.content.vi || post.content.en || '') : post.content;
                    post.isEditing = true;
                },
                saveEditPost(post) {
                    const newContent = post.editContent;
                    if (!newContent || !newContent.trim()) return;

                    const originalContent = post.content;

                    // Instantly show the new text on the card, close editor, and show success
                    post.content = newContent;
                    post.isEditing = false;

                    this.globalModal = {
                        show: true,
                        title: this.lang === 'vi' ? 'Đã lưu' : 'Saved',
                        message: this.lang === 'vi' ? 'Bài viết của bạn đã được cập nhật!' : 'Your post has been successfully updated!'
                    };

                    fetch(`/api/v1/aoa/posts/${post.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: this.user.username,
                            content: newContent
                        })
                    })
                        .then(res => {
                            if (!res.ok) throw new Error("Edit post failed");
                            return res.json();
                        })
                        .then(data => {
                            post.content = data.content;
                        })
                        .catch(e => {
                            console.warn("[Edit Post Optimistic Rollback]", e);
                            // Rollback state
                            post.content = originalContent;
                            post.editContent = newContent;
                            post.isEditing = true;
                            alert(this.lang === 'vi' ? 'Không thể lưu bài viết. Vui lòng kiểm tra kết nối.' : 'Failed to save post. Please check connection.');
                        });
                },
                initPostGraph(id, rawData) {
                    const renderGraph = () => {
                        const el = document.getElementById('graph-' + id);
                        if (el) el.innerHTML = '';
                        window.renderBinaryTreeGraph('graph-' + id, this.localize(rawData), { interactive: true, fitToView: true });
                    };

                    this.$watch('lang', () => {
                        this.$nextTick(() => renderGraph());
                    });

                    this.$nextTick(() => renderGraph());
                }
            };
        }
    </script>
    <!-- FAB for Mobile -->
    <button
        class="md:hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-[#fbbf24] text-black flex items-center justify-center beacon-glow z-50 hover:bg-[#fbbf24] transition-colors shadow-lg">
        <span class="material-symbols-outlined text-2xl">edit</span>
    </button>
</body>

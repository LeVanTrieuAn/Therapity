<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <script src="/nocobase-adapter.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thapsang Mindset OS</title>
    <script src="i18n.js?v=11"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#fbbf24",
                        "primary-fixed-dim": "#fbbf24",
                        "on-primary-fixed": "#221b00",
                        "surface": "#0a0a0a",
                        "surface-variant": "#525252",
                        "on-surface": "#dfe2eb",
                        "on-surface-variant": "#d0c6ab",
                        "outline-variant": "#4d4732",
                        "background": "#0a0a0a",
                        "error": "#ffb4ab"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Montserrat"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["33px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-sm": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["25px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["19px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["49px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        [x-cloak] {
            display: none !important;
        }

        .glass-panel {
            background: rgba(24, 28, 34, 0.95);
            border: 1px solid rgba(255, 225, 109, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .dragging {
            opacity: 0.5;
            border: 2px dashed #fbbf24 !important;
        }

        .draggable-task-card {
            cursor: grab;
        }

        .draggable-task-card:active {
            cursor: grabbing !important;
        }

        .kanban-col {
            min-height: 200px;
        }

        /* Premium Custom Scrollbars for Kanban Columns */
        .kanban-col::-webkit-scrollbar {
            width: 6px;
        }

        .kanban-col::-webkit-scrollbar-track {
            background: rgba(24, 28, 34, 0.2);
            border-radius: 9999px;
        }

        .kanban-col::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .kanban-col::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 225, 109, 0.4);
        }

        .drag-over {
            background: rgba(233, 196, 0, 0.1);
            border: 1px dashed #f59e0b;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-page-fade {
            animation: pageFadeIn 0.8s ease-out forwards;
        }

        /* Premium Flag Buttons Style with Layered Stack & Opacity Overlap */
        .ts-flag-stack {
            position: relative;
            width: 48px;
            height: 32px;
            display: inline-block;
            cursor: pointer;
        }

        .ts-flag-btn {
            position: absolute;
            top: 0;
            left: 0;
            padding: 5px 7px;
            border-radius: 8px;
            background: rgba(49, 53, 60, 0.15);
            border: 1px solid rgba(77, 71, 50, 0.3);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                z-index 0.4s ease,
                background 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ts-flag-btn.ts-lang-active {
            z-index: 10;
            opacity: 1;
            transform: translate(0, 0) scale(1);
            background: rgba(255, 225, 109, 0.15);
            border-color: rgba(255, 225, 109, 0.6);
            box-shadow: 0 4px 12px rgba(255, 225, 109, 0.3);
        }

        .ts-flag-btn.ts-lang-inactive {
            z-index: 5;
            opacity: 0.25;
            transform: translate(6px, 4px) scale(0.92);
            background: rgba(49, 53, 60, 0.1);
            border-color: rgba(77, 71, 50, 0.2);
            box-shadow: none;
        }

        .ts-flag-stack:hover .ts-flag-btn.ts-lang-active {
            transform: translate(-2px, -2px) scale(1.02);
            border-color: rgba(255, 225, 109, 0.8);
            box-shadow: 0 6px 16px rgba(255, 225, 109, 0.4);
        }

        .ts-flag-stack:hover .ts-flag-btn.ts-lang-inactive {
            transform: translate(8px, 6px) scale(0.95);
            opacity: 0.75;
            background: rgba(49, 53, 60, 0.3);
            border-color: rgba(255, 225, 109, 0.35);
        }

        /* Global Toast Styles & Light Mode Overrides */
        #global-toast span {
            color: inherit !important;
        }

        html.light #global-toast {
            background-color: #ffffff !important;
            border-color: rgba(22, 32, 97, 0.2) !important;
            color: #162061 !important;
            box-shadow: 0 4px 12px rgba(22, 32, 97, 0.1) !important;
        }

        html.light #global-toast[data-type="success"] {
            background-color: #e6f4ea !important;
            border-color: #34a853 !important;
            color: #137333 !important;
        }

        html.light #global-toast[data-type="error"] {
            background-color: #fce8e6 !important;
            border-color: #ea4335 !important;
            color: #c5221f !important;
        }

        html.light #global-toast[data-type="success"] #global-toast-icon {
            color: #137333 !important;
        }

        html.light #global-toast[data-type="error"] #global-toast-icon {
            color: #c5221f !important;
        }

        html.light #global-toast[data-type="info"] #global-toast-icon {
            color: #162061 !important;
        }

        html.light input[type="date"] {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
            color-scheme: light !important;
        }

        @keyframes swing {

            0%,
            100% {
                transform: rotate(0deg);
            }

            20% {
                transform: rotate(15deg);
            }

            40% {
                transform: rotate(-10deg);
            }

            60% {
                transform: rotate(5deg);
            }

            80% {
                transform: rotate(-5deg);
            }
        }

        .animate-swing {
            animation: swing 1s ease-in-out infinite;
            transform-origin: top center;
        }

        /* CSS Strikethrough Animation for Subtasks */
        .subtask-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .subtask-input.completed {
            text-decoration: line-through;
            text-decoration-color: #fbbf24;
            color: rgba(255, 255, 255, 0.4) !important;
            background-color: rgba(24, 28, 34, 0.1) !important;
            border-color: rgba(153, 144, 119, 0.1) !important;
            opacity: 0.7;
        }
    </style>
</head>

<body
    class="bg-background text-on-surface font-body-md min-h-screen overflow-hidden selection:bg-primary-fixed/30 selection:text-primary-fixed"
    x-data="tasksApp()" x-init="init();" @user-updated.window="user = $event.detail"
    @storage.window="if ($event.key === 'thapsang_user') user = JSON.parse($event.newValue || '{}')"
    @ts-lang-changed.window="lang = $event.detail.lang" x-cloak>

    <aside :class="isSidebarCollapsed ? 'sidebar-collapsed !w-20 px-2' : 'px-4'"
        class="hidden md:flex bg-surface-container-low/20  h-screen w-64 fixed left-0 top-0 border-r border-outline-variant/30 flex-col py-8 z-50 animate-sidebar-fade transition-all duration-300">
        <div class="mb-12 px-2 relative min-h-[40px] z-[60]">
            <div class="flex flex-col items-start gap-4 relative w-full">
                <!-- Collapse button absolute top right -->
                <div class="absolute top-0 transition-all duration-300 z-10"
                    :class="isSidebarCollapsed ? 'left-1/2 -translate-x-1/2' : 'right-0 -translate-x-2'">
                    <span @click="toggleSidebar()"
                        class="cursor-pointer text-on-surface-variant/50 hover:text-primary-fixed font-mono text-[16px] font-bold leading-none select-none transition-all duration-300 hidden md:block"
                        title="" x-text="isSidebarCollapsed ? '>' : '<'">&lt;</span>
                </div>
                
                <div class="transition-all duration-300 origin-left w-full"
                    :class="isSidebarCollapsed ? 'opacity-0 scale-50 w-0 h-0 overflow-hidden m-0' : 'opacity-100 scale-100 pt-1'">
                    <h1 class="font-display-lg text-headline-md text-primary-fixed tracking-tight">Thapsang</h1>
                    <div class="flex items-center justify-between gap-3 w-full mt-1 pr-1">
                        <p class="font-label-sm text-label-sm text-on-surface-variant shrink-0" data-i18n="sidebar.tagline">
                            Mindset OS</p>
                        <div class="flex items-center gap-2">
                        <button id="ts-theme-btn" onclick="toggleTheme()"
                            class="w-[37px] h-[37px] p-0 shrink-0 text-on-surface-variant hover:text-white transition-colors flex items-center justify-center"
                            data-i18n-title="common.switch_theme" title="Chuyển giao diện">
                            <span id="ts-theme-icon" class="material-symbols-outlined text-[21px]">light_mode</span>
                        </button>
                        <div class="relative ts-lang-dropdown" x-data="{ openLang: false }" @click.away="openLang = false">
            <button @click="openLang = !openLang" type="button" class="ts-lang-dropdown-btn flex items-center gap-1.5">
                <template x-if="lang === 'vi'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" class="w-5 h-3.5 rounded-[2px] shadow-sm">
                        <rect width="30" height="20" fill="#da251d" />
                        <polygon fill="#ffff00" points="15,4 16.18,8.27 20.76,8.27 17.06,10.91 18.47,15.18 15,12.54 11.53,15.18 12.94,10.91 9.24,8.27 13.82,8.27" />
                    </svg>
                </template>
                <template x-if="lang === 'en'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" class="w-5 h-3.5 rounded-[2px] shadow-sm">
                        <rect width="60" height="30" fill="#012169" />
                        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                        <path d="M0,0 L30,15 M60,30 L30,15 M60,0 L30,15 M0,30 L30,15" stroke="#c8102e" stroke-width="2" />
                        <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10" />
                        <path d="M30,0 L30,30 M0,15 L60,15" stroke="#c8102e" stroke-width="6" />
                    </svg>
                </template>
                <span class="font-label-sm text-[11px] font-bold uppercase" x-text="lang"></span>
                <span class="material-symbols-outlined text-[14px] transition-transform" :class="openLang ? 'rotate-180' : ''">expand_more</span>
            </button>
            <div x-show="openLang" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="ts-lang-dropdown-menu absolute right-0 mt-2 w-32 z-[60]" x-cloak>
                <div class="flex flex-col gap-0.5">
                    <button @click="typeof setLang === 'function' ? setLang('vi') : (lang='vi', window.dispatchEvent(new CustomEvent('ts-lang-changed', {detail: {lang: 'vi'}}))); openLang = false" type="button" class="ts-lang-dropdown-item w-full text-left px-3 py-2 flex items-center gap-3 cursor-pointer" :class="lang === 'vi' ? 'ts-lang-active' : ''">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" class="w-5 h-3.5 rounded-[2px] shrink-0 shadow-sm">
                            <rect width="30" height="20" fill="#da251d" />
                            <polygon fill="#ffff00" points="15,4 16.18,8.27 20.76,8.27 17.06,10.91 18.47,15.18 15,12.54 11.53,15.18 12.94,10.91 9.24,8.27 13.82,8.27" />
                        </svg>
                        <span class="text-[12px] font-bold">Tiếng Việt</span>
                    </button>
                    <button @click="typeof setLang === 'function' ? setLang('en') : (lang='en', window.dispatchEvent(new CustomEvent('ts-lang-changed', {detail: {lang: 'en'}}))); openLang = false" type="button" class="ts-lang-dropdown-item w-full text-left px-3 py-2 flex items-center gap-3 cursor-pointer" :class="lang === 'en' ? 'ts-lang-active' : ''">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" class="w-5 h-3.5 rounded-[2px] shrink-0 shadow-sm">
                            <rect width="60" height="30" fill="#012169" />
                            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                            <path d="M0,0 L30,15 M60,30 L30,15 M60,0 L30,15 M0,30 L30,15" stroke="#c8102e" stroke-width="2" />
                            <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10" />
                            <path d="M30,0 L30,30 M0,15 L60,15" stroke="#c8102e" stroke-width="6" />
                        </svg>
                        <span class="text-[12px] font-bold">English</span>
                    </button>
                </div>
            </div>
        </div>
                    </div>
                </div>
           </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-2 flex-grow mt-2">
            <a class="flex items-center gap-3 [.sidebar-collapsed_&]:gap-0 [.sidebar-collapsed_&]:justify-center px-4 py-3 text-on-surface-variant font-medium opacity-60 hover:bg-surface-variant/40 hover:opacity-100 transition-all duration-300 rounded-lg group border-l-4 border-transparent"
                href="/coach">
                <span class="material-symbols-outlined shrink-0">chat_bubble</span>
                <span
                    class="font-body-md text-[17px] transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 [.sidebar-collapsed_&]:overflow-hidden whitespace-nowrap"

            </a>
            <a class="flex items-center gap-3 [.sidebar-collapsed_&]:gap-0 [.sidebar-collapsed_&]:justify-center px-4 py-3 text-on-surface-variant font-medium opacity-60 hover:bg-surface-variant/40 hover:opacity-100 transition-all duration-300 rounded-lg group border-l-4 border-transparent"
                href="/diary">
                <span class="material-symbols-outlined shrink-0">book</span>
                <span
                    class="font-body-md text-[17px] transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 [.sidebar-collapsed_&]:overflow-hidden whitespace-nowrap"
                    data-i18n="nav.diary">&nbsp;</span>
            </a>
            <a class="flex items-center gap-3 [.sidebar-collapsed_&]:gap-0 [.sidebar-collapsed_&]:justify-center px-4 py-3 text-on-surface-variant font-medium opacity-60 hover:bg-surface-variant/40 hover:opacity-100 transition-all duration-300 rounded-lg group border-l-4 border-transparent"
                href="/aoa">
                <span class="material-symbols-outlined shrink-0">hub</span>
                <span
                    class="font-body-md text-[17px] transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 [.sidebar-collapsed_&]:overflow-hidden whitespace-nowrap"
                    data-i18n="nav.aoa">&nbsp;</span>
            </a>
            <a class="flex items-center gap-3 [.sidebar-collapsed_&]:gap-0 [.sidebar-collapsed_&]:justify-center px-4 py-3 text-primary-fixed font-bold border-l-4 border-primary-fixed-dim bg-gradient-to-r from-primary-fixed/10 to-transparent rounded-r-lg group"
                href="/tasks">
                <span class="material-symbols-outlined shrink-0"
                    style="font-variation-settings: 'FILL' 1;">checklist</span>
                <span
                    class="font-body-md text-[17px] transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 [.sidebar-collapsed_&]:overflow-hidden whitespace-nowrap"
                    data-i18n="nav.tasks">&nbsp;</span>
            </a>

            <a class="flex items-center gap-3 [.sidebar-collapsed_&]:gap-0 [.sidebar-collapsed_&]:justify-center px-4 py-3 text-on-surface-variant font-medium opacity-60 hover:bg-surface-variant/40 hover:opacity-100 transition-all duration-300 rounded-lg group border-l-4 border-transparent"
                href="/cohort">
                <span class="material-symbols-outlined shrink-0">groups</span>
                <span
                    class="font-body-md text-[17px] transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 [.sidebar-collapsed_&]:overflow-hidden whitespace-nowrap"

            </a>
        </div>

            <div class="w-[38.4px] h-[38.4px] rounded-[12px] bg-[#fbbf24]/10 border border-[#fbbf24]/80 flex items-center justify-center shrink-0 overflow-hidden transition-colors hover:bg-[#fbbf24]/20 cursor-pointer"

                <template x-if="user.avatar">
                    <img :src="user.avatar" referrerpolicy="no-referrer" class="w-full h-full object-cover">
                </template>
                <template x-if="!user.avatar">
                    <span class="material-symbols-outlined text-[#fbbf24] text-[29px]"

                </template>
            </div>
            
            <div class="flex flex-col justify-center min-w-0 transition-all duration-300 [.sidebar-collapsed_&]:opacity-0 [.sidebar-collapsed_&]:w-0 cursor-pointer ml-3 mr-auto group"
                @click="window.location.href='/aoa?tab=mine'">
                <p class="font-label-sm text-[15px] font-bold text-on-surface truncate w-full group-hover:text-[#fbbf24] transition-colors"

            </button>
        </div>

        <div class="flex justify-center pb-2 pt-1">

    <div x-show="pageLoading" x-transition.opacity x-cloak :class="isSidebarCollapsed ? 'md:left-20' : 'md:left-64'"
        class="fixed top-0 bottom-0 left-0 right-0 bg-[#000000]/60  z-[100] flex flex-col items-center justify-center transition-all duration-300">
        <div
            class="glass-panel p-8 rounded-3xl border border-[#fbbf24]/20 shadow-[0_8px_32px_rgba(0,0,0,0.35)] flex flex-col items-center gap-4 bg-[#0a0a0a]/80 max-w-xs text-center animate-modal-in">

                <div class="absolute inset-0 rounded-full border border-[#fbbf24]/20 animate-ping"></div>

                    class="absolute w-10 h-10 rounded-full border-2 border-t-[#fbbf24] border-r-transparent border-l-transparent border-b-transparent animate-spin">

                <span class="material-symbols-outlined text-[#fbbf24] text-xl">checklist</span>
            </div>
            <p class="text-xs font-bold uppercase tracking-[0.15em] text-[#fbbf24] font-mono mt-2"

            <p class="text-[12px] text-on-surface-variant/80 font-medium leading-relaxed"

        </div>
    </div>

            <div>
                <h2 class="font-headline-md text-[29px] font-bold text-on-surface" data-i18n="tasks.title">Nhiệm vụ</h2>
                <!-- Selected Session Indicator -->
                <p class="text-[19px] text-on-surface mt-1 font-extrabold">
                    <span
                        x-text="selectedSessionFilter === 'all' ? (lang === 'vi' ? 'Tất cả phiên làm việc' : 'All sessions') : cleanText(selectedSessionFilter)"></span>
                </p>
            </div>
            <div class="flex items-center gap-3 relative">
                <!-- Notification Bell Button -->
                <div class="relative" x-data="{ openNotifications: false }">
                    <button @click="openNotifications = !openNotifications" @click.away="openNotifications = false"

                        <span class="material-symbols-outlined text-[21px]"

                        <template x-if="notifications.filter(n => !n.read).length > 0">
                            <span
                                class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-error text-background text-[11px] font-extrabold rounded flex items-center justify-center border border-surface shadow-[0_0_8px_#ffb4ab]"

                    </button>

                    <!-- Notifications Dropdown List -->
                    <div x-show="openNotifications" x-transition.opacity.duration.200ms style="display: none;"

                                </div>

                                    <div class="flex-grow">
                                        <p class="text-[14px] leading-relaxed font-semibold"

                                        <div class="flex items-center gap-1.5 mt-1.5">
                                            <span

                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- History Dropdown -->

                        <span class="material-symbols-outlined text-[19px]">history</span> <span
                            data-i18n="tasks.work_history">Lịch sử làm việc</span>
                        <span class="material-symbols-outlined text-[19px]">expand_more</span>
                    </button>
                    <div x-show="openFilter" x-transition.opacity.duration.200ms style="display: none;"

                    </div>
                </div>

        <!-- Kanban Board (DO) -->
        <div class="flex-1 overflow-x-auto flex gap-6 pb-4 hide-scroll">

            <!-- Column 1: PLAN (Backlog) -->

                class="flex-1 min-w-[300px] flex flex-col bg-surface-variant/10 rounded-xl border border-outline-variant/30 overflow-hidden"
                @dragover.prevent="dragOverCol = 'backlog'" @dragleave="dragOverCol = null" @drop="drop('backlog')">
                <div
                    class="p-4 border-b border-outline-variant/30 bg-surface-variant/30 flex justify-between items-center h-14">

                        <span class="material-symbols-outlined text-[17px] text-on-surface-variant">list_alt</span>
                        <span data-i18n="tasks.plan">Nhiệm vụ đang thực hiện</span>
                    </h3>
                    <span
                        class="w-6 h-6 flex items-center justify-center rounded-full bg-surface-variant/40 border border-outline-variant/30 text-[12px] font-bold text-on-surface-variant"

                </div>
                <div class="p-4 flex-1 overflow-y-auto kanban-col space-y-4">

                                <span

                            </div>
                            <h4 class="font-bold text-[15px] text-on-surface mb-1 leading-tight group-hover:text-primary-fixed"

                                <div class="flex items-center gap-1"><span

                                        x-text="task.effort + ' ' + (lang === 'en' ? 'subtasks' : 'nhiệm vụ phụ')"></span>
                                </div>
                                <div class="flex items-center gap-1" :class="task.deadline ? 'text-error' : ''"><span
                                        class="material-symbols-outlined text-[15px]">event</span> <span
                                        x-text="task.deadline || (lang === 'en' ? 'No deadline' : 'Chưa có hạn chót')"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Column 2: DO (In Progress) -->
            <div :class="{ 'flex': activePanel === 'in_progress', 'hidden md:flex': activePanel !== 'in_progress', 'drag-over': dragOverCol === 'in_progress' }"

                @dragover.prevent="dragOverCol = 'in_progress'" @dragleave="dragOverCol = null"
                @drop="drop('in_progress')">
                <div
                    class="p-4 border-b border-primary-fixed/30 bg-primary-fixed/5 flex justify-between items-center shadow-[0_4px_20px_rgba(233,196,0,0.05)] h-14">
                    <h3
                        class="font-bold text-primary-fixed normal-case tracking-widest text-[14px] flex items-center gap-2">
                        <span class="material-symbols-outlined text-[17px]">bolt</span> <span data-i18n="tasks.do">Thực
                            thi (Do)</span>
                    </h3>
                    <span
                        class="w-6 h-6 flex items-center justify-center rounded-full bg-primary-fixed/10 border border-primary-fixed/40 text-[12px] font-bold text-primary-fixed"

                </div>
                <div class="p-4 flex-1 overflow-y-auto kanban-col space-y-4">
                    <template
                        x-for="task in tasks.filter(t => t.status === 'in_progress' && (selectedSessionFilter === 'all' || t.contextLink === selectedSessionFilter))"

                        <div draggable="true" @dragstart="dragStart(task.id, $event)" @dragend="dragEnd($event)"
                             @click="openPlanModal(task)"
                             class="bg-white dark:bg-surface/60 border border-primary-fixed p-4 rounded-lg draggable-task-card hover:shadow-[0_0_15px_rgba(233,196,0,0.15)] transition-all relative overflow-hidden">
                            <div
                                class="absolute inset-0 bg-gradient-to-br from-primary-fixed/10 to-transparent pointer-events-none">
                            </div>
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-fixed shadow-[0_0_10px_#f59e0b]">
                            </div>
                            <h4 class="font-bold text-[15px] text-[#162061] dark:text-white mb-2 ml-1"
                                x-text="cleanText(task.title)"></h4>

                            <!-- Subtasks / Micro-steps -->
                            <div class="space-y-1 mb-3 ml-1">
                                <template x-for="(sub, sIdx) in task.subtasks" :key="sIdx">
                                    <label class="flex items-center gap-2 cursor-pointer group/sub" @click.stop>
                                        <input type="checkbox" x-model="sub.completed" @change="toggleSubtask(task)"
                                               class="w-3 h-3 rounded-sm bg-white dark:bg-surface border-outline-variant text-primary-fixed focus:ring-0 cursor-pointer" />
                                        <span class="text-[12px] group-hover/sub:text-primary-fixed transition-colors"
                                              :class="sub.completed ? 'line-through opacity-50 text-[#162061] dark:text-on-surface-variant' : 'text-[#162061] dark:text-on-surface'"
                                              x-text="cleanText(sub.title)"></span>
                                    </label>
                                </template>
                            </div>

                            <div
                                class="flex items-center justify-between mt-2 pt-2 border-t border-primary-fixed/20 ml-1 relative z-10">

                                <button @click.stop="moveToCheck(task)" title="Hoàn thành"
                                        class="w-7 h-7 rounded border border-primary-fixed flex items-center justify-center text-primary-fixed hover:bg-primary-fixed hover:text-background transition-colors">
                                    <span class="material-symbols-outlined text-[17px]">check</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Column 3: CHECK (Reviewing / Done) -->
            <div :class="{ 'flex': activePanel === 'done', 'hidden md:flex': activePanel !== 'done', 'drag-over': dragOverCol === 'done' }"
                class="flex-1 min-w-[300px] flex flex-col bg-surface-variant/10 rounded-xl border border-outline-variant/30 overflow-hidden"
                @dragover.prevent="dragOverCol = 'done'" @dragleave="dragOverCol = null" @drop="drop('done')">
                <div class="p-4 border-b border-green-500/20 bg-green-500/5 flex justify-between items-center h-14">
                    <h3
                        class="font-bold text-green-400 normal-case tracking-widest text-[14px] flex items-center gap-2">
                        <span class="material-symbols-outlined text-[17px] text-green-400">task_alt</span> <span
                            data-i18n="tasks.check">Kiểm tra (Check)</span>
                    </h3>
                    <span
                        class="w-6 h-6 flex items-center justify-center rounded-full bg-green-500/10 border border-green-500/30 text-[12px] font-bold text-green-400"
                        x-text="tasks.filter(t => t.status === 'done').length"></span>
                </div>
                <div class="p-4 flex-1 overflow-y-auto kanban-col space-y-4">
                    <template
                        x-for="task in tasks.filter(t => t.status === 'done' && (selectedSessionFilter === 'all' || t.contextLink === selectedSessionFilter))"
                        :key="task.id">
                        <div draggable="true" @dragstart="dragStart(task.id, $event)" @dragend="dragEnd($event)"
                             @click="openPlanModal(task)"
                             class="bg-surface/40 border border-green-500/20 border-l-4 border-l-green-500 p-4 rounded-lg draggable-task-card hover:border-green-500/40 hover:shadow-[0_0_15px_rgba(34,197,94,0.05)] opacity-95 hover:opacity-100 transition-all relative overflow-hidden group cursor-pointer">
                            <h4 class="font-bold text-[15px] text-on-surface leading-tight"
                                :class="task.title.toLowerCase().includes('task') ? 'line-through decoration-on-surface-variant/50' : ''"
                                x-text="cleanText(task.title)"></h4>
                            <p class="text-[12px] text-green-400/80 mt-2 italic flex items-center gap-1 font-medium"
                               x-show="!task.contextLink || !task.contextLink.toLowerCase().includes('lộ trình cá nhân')">
                                <span class="material-symbols-outlined text-[15px] text-green-400">check_circle</span>
                                <span data-i18n="tasks.ai_review">Đã được AI Review</span>
                            </p>
                        </div>
                    </template>
                </div>
            </div>

        </div>

        <!-- Mobile Floating Switcher Tab Bar -->
        <div
            class="ts-mobile-nav md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-[#171717]/90  border border-[#fbbf24]/30 px-3 py-2 rounded-full flex items-center gap-2 shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-300">
            <!-- Backlog Column Button -->
            <button @click="activePanel = 'backlog'"
                :class="activePanel === 'backlog' ? 'bg-gradient-to-r from-primary-fixed-dim via-primary-fixed to-primary-fixed-dim text-on-primary-fixed shadow-[0_4px_14px_rgba(255,225,109,0.35)] scale-105 font-semibold' : 'text-on-surface-variant hover:text-on-surface hover:bg-white/5'"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full font-label-sm text-[14px] tracking-wider font-bold transition-all duration-300">
                <span class="material-symbols-outlined text-base">list_alt</span>
                <span data-i18n="tasks.plan">Nhiệm vụ</span>
            </button>
            <!-- In Progress Column Button -->
            <button @click="activePanel = 'in_progress'"
                :class="activePanel === 'in_progress' ? 'bg-gradient-to-r from-primary-fixed-dim via-primary-fixed to-primary-fixed-dim text-on-primary-fixed shadow-[0_4px_14px_rgba(255,225,109,0.35)] scale-105 font-semibold' : 'text-on-surface-variant hover:text-on-surface hover:bg-white/5'"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full font-label-sm text-[14px] tracking-wider font-bold transition-all duration-300">
                <span class="material-symbols-outlined text-base">bolt</span>
                <span data-i18n="tasks.do">Đang thực hiện</span>
            </button>
            <!-- Done Column Button -->
            <button @click="activePanel = 'done'"
                :class="activePanel === 'done' ? 'bg-gradient-to-r from-primary-fixed-dim via-primary-fixed to-primary-fixed-dim text-on-primary-fixed shadow-[0_4px_14px_rgba(255,225,109,0.35)] scale-105 font-semibold' : 'text-on-surface-variant hover:text-on-surface hover:bg-white/5'"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full font-label-sm text-[14px] tracking-wider font-bold transition-all duration-300">
                <span class="material-symbols-outlined text-base">task_alt</span>
                <span data-i18n="tasks.check">Hoàn thành</span>
            </button>
        </div>
    </main>

            color: #4ade80 !important;
        }

        .theme-done .bg-primary-fixed {
            background-color: #22c55e !important;
        }

        .theme-done .bg-primary-fixed\/5 {
            background-color: rgba(34, 197, 94, 0.05) !important;
        }

        .theme-done .bg-primary-fixed\/10 {
            background-color: rgba(34, 197, 94, 0.1) !important;
        }

        .theme-done .bg-primary-fixed\/20 {
            background-color: rgba(34, 197, 94, 0.2) !important;
        }

        .theme-done .border-primary-fixed {
            border-color: #22c55e !important;
        }

        .theme-done .border-primary-fixed\/20 {
            border-color: rgba(34, 197, 94, 0.2) !important;

    <!-- PLAN MODAL: Edit Task Details -->
    <div x-show="showPlanModal" x-transition
        class="fixed inset-0 z-[60] bg-black/60  flex items-center justify-center p-4">
        <div :class="selectedTask?.status === 'done' ? 'theme-done' : ''"
            class="glass-panel w-full max-w-2xl rounded-2xl flex flex-col shadow-2xl border border-outline-variant/50 overflow-hidden"
            @click.away="savePlan()">
            <div class="p-6 border-b border-outline-variant/30 bg-surface/50 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary-fixed text-[25px]">edit_document</span>
                    <h3 class="font-headline-md text-[21px] text-white"
                        x-text="selectedTask?.status === 'done' ? (lang === 'en' ? 'Completed Task' : 'Nhiệm Vụ Đã Hoàn Thành') : (selectedTask?.status === 'in_progress' ? (lang === 'en' ? 'Task in Progress' : 'Nhiệm Vụ Đang Thực Hiện') : (lang === 'en' ? 'Task' : 'Nhiệm Vụ'))">
                    </h3>
                </div>
                <div class="flex items-center gap-3">

                    <template
                        x-if="selectedTask && (selectedTask.status === 'backlog' || selectedTask.status === 'in_progress')">

                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[13px] font-bold transition-all border shadow-sm cursor-pointer group"

                                    ? 'bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border-amber-500/30' 
                                    : 'bg-green-500/10 hover:bg-green-500/20 text-green-400 border-green-500/30'">
                            <span class="material-symbols-outlined text-[17px]"
                                x-text="selectedTask.status === 'backlog' ? 'play_arrow' : 'check_circle'"></span>
                            <span x-text="selectedTask.status === 'backlog' 
                                ? (lang === 'en' ? 'Start' : 'Thực hiện') 
                                : (lang === 'en' ? 'Complete' : 'Hoàn thành')"></span>
                            <span
                                class="material-symbols-outlined text-[15px] opacity-75 group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
                        </button>
                    </template>
                    <button @click="showPlanModal = false"
                        class="text-on-surface-variant hover:text-white flex items-center justify-center p-1 rounded-full hover:bg-surface-variant/30 transition-all"><span

            </div>

            <div class="p-6 flex-1 overflow-y-auto space-y-6 max-h-[70vh] hide-scroll">

                    <span class="material-symbols-outlined text-primary-fixed text-[21px] mt-0.5">link</span>
                    <div>
                        <p class="text-[11px] normal-case font-bold text-primary-fixed/80 tracking-widest mb-1"
                            x-text="lang === 'en' ? 'Session' : 'Phiên Làm Việc'"></p>
                        <p class="text-[15px] text-on-surface"
                            x-text="cleanText(selectedTask?.contextLink) || (lang === 'en' ? 'Manual task' : 'Task tạo thủ công')">

                </div>

                        :class="{'opacity-70 cursor-not-allowed': selectedTask?.status === 'done'}" />

                <div>
                    <div class="flex justify-between items-center mb-2">

                        <input type="date" x-model="selectedTask.deadline" :readonly="selectedTask?.status === 'done'"

                            :class="{'opacity-70 cursor-not-allowed': selectedTask?.status === 'done'}" />
                    </div>

                    <div class="flex justify-between items-center mb-3">

                        <div class="relative w-6 h-6 flex items-center justify-center shrink-0">
                            <div class="absolute inset-0 rounded-full border border-primary-fixed/20 animate-ping">

                                    if (draggedIdx !== null && draggedIdx !== idx) {

                                        const item = subtasks.splice(draggedIdx, 1)[0];

    <!-- DELETE CONFIRM MODAL (Glassmorphism) -->

    <!-- AI CHECK-IN MODAL (CHECK & ACT) -->
    <div x-show="showCheckModal" x-transition
        class="fixed inset-0 z-[60] bg-black/80  flex items-center justify-center p-4">
        <div class="bg-surface border border-outline-variant/50 w-full max-w-2xl rounded-2xl flex flex-col shadow-2xl overflow-hidden relative"
            @click.away="showCheckModal = false">

            <!-- Dynamic Header based on Status -->
            <div class="p-6 border-b border-outline-variant/30 flex items-start gap-4 relative overflow-hidden"
                :class="checkTask?.status === 'done' ? 'bg-green-500/10' : 'bg-error/10'">
                <div class="absolute right-0 top-0 opacity-10 pointer-events-none">
                    <span class="material-symbols-outlined text-[121px]"
                        x-text="checkTask?.status === 'done' ? 'emoji_events' : 'psychology_alt'"></span>

                    :class="checkTask?.status === 'done' ? 'bg-green-500/20 border-green-500/50 text-green-400' : 'bg-error/20 border-error/50 text-error'">
                    <span class="material-symbols-outlined text-[25px]"
                        x-text="checkTask?.status === 'done' ? 'check' : 'warning'"></span>

                <div class="z-10">
                    <h3 class="font-headline-md text-[21px] text-white"
                        x-text="checkTask?.status === 'done' ? (lang === 'en' ? 'Congratulations on completing the task!' : 'Chúc mừng đã hoàn thành nhiệm vụ!') : (lang === 'en' ? 'AI Check-in: Barrier Analysis' : 'AI Check-in: Phân Tích Lực Cản')">

                    <p class="text-[17px] text-on-surface italic leading-relaxed ml-2"
                        x-text="checkTask?.status === 'done'

                            : (lang === 'en' ? 'It seems this task is stuck. Don\'t worry. Be honest: what was your biggest barrier during execution? (Due to wrong time estimation, lack of resources, or psychological barriers?)' : 'Có vẻ như task này đang bị kẹt. Đừng lo lắng. Hãy trung thực nhìn nhận: Rào cản lớn nhất của bạn lúc thực thi là gì? (Do ước lượng sai thời gian, thiếu tài nguyên hay do rào cản tâm lý?)')">

                        :placeholder="lang === 'en' ? 'Document your learning breakthroughs or core barriers here...' : 'Ghi lại bài học hoặc đánh giá tại đây...'"></textarea>

            <!-- ACT Phase Actions -->
            <div
                class="p-6 border-t border-outline-variant/30 bg-surface/50 flex flex-wrap justify-between items-center gap-4">
                <p class="text-[14px] text-on-surface-variant/70 italic flex-1 min-w-[200px]"
                    x-html="lang === 'en' ? 'This data will be used by the <span class=\'text-primary-fixed\'>AI Coach to update your Mindset</span> in future sessions.' : 'Dữ liệu này sẽ được dùng để <span class=\'text-primary-fixed\'>AI tham vấn hiểu hơn</span> về bạn trong các phiên làm việc tới.'">
                </p>

                <div class="flex flex-wrap justify-end gap-3 shrink-0 w-full sm:w-auto">
                    <!-- ACT = Publish / Finish -->
                    <template x-if="checkTask?.status === 'done'">

                            <span class="material-symbols-outlined text-[19px]">public</span> <span
                                x-text="lang === 'en' ? 'Publish to AOA' : 'Đăng lên AOA'"></span>

                    <button @click="submitCheck()"

    <!-- Global Toast Notification -->
    <div id="global-toast"
        style="display:none;position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:12px;border:1px solid;box-shadow:0 8px 30px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;transition:opacity 0.3s;opacity:0;pointer-events:none;"
        class="flex items-center gap-3">
        <span id="global-toast-icon" style="font-family:'Material Symbols Outlined';font-size:19px;">check_circle</span>
        <span id="global-toast-msg"></span>
    </div>

    <script>
        function showGlobalToast(msg, type) {
            const el = document.getElementById('global-toast');
            const icon = document.getElementById('global-toast-icon');
            const msgEl = document.getElementById('global-toast-msg');
            if (!el) return;
            el.setAttribute('data-type', type || 'info');
            msgEl.textContent = msg;
            if (type === 'success') {
                el.style.background = 'rgba(6,78,59,0.95)';
                el.style.borderColor = 'rgba(74,222,128,0.5)';
                el.style.color = '#86efac';
                icon.textContent = 'check_circle';
            } else if (type === 'error') {
                el.style.background = 'rgba(69,10,10,0.95)';
                el.style.borderColor = 'rgba(255,180,171,0.5)';
                el.style.color = '#ffb4ab';
                icon.textContent = 'error';
            } else {
                el.style.background = 'rgba(22,27,34,0.97)';
                el.style.borderColor = 'rgba(255,225,109,0.4)';
                el.style.color = '#fbbf24';
                icon.textContent = 'info';
            }
            el.style.display = 'flex';
            setTimeout(() => el.style.opacity = '1', 10);
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.style.display = 'none', 300);
            }, 3500);
        }

        function tasksApp() {
            return {
                isSidebarCollapsed: localStorage.getItem('thapsang_sidebar_collapsed') === 'true',
                toggleSidebar() {
                    this.isSidebarCollapsed = !this.isSidebarCollapsed;
                    localStorage.setItem('thapsang_sidebar_collapsed', this.isSidebarCollapsed);
                },
                user: JSON.parse(localStorage.getItem('thapsang_user') || '{}'),
                tasks: [],
                draggedTaskId: null,
                dragOverCol: null,
                pageLoading: true,
                activePanel: 'backlog',

                // Modals
                showPlanModal: false,
                generatingMicrosteps: false,
                notifications: [],
                selectedTask: {
                    title: '',
                    goal: '',
                    deadline: '',
                    effort: 1,
                    subtasks: [],
                    contextLink: ''
                },
                editTitle: { vi: '', en: '' },
                editGoal: { vi: '', en: '' },
                editSubtasks: [],
                planModalSnapshot: null,
                lang: localStorage.getItem('thapsang_lang') || 'vi',
                toSentenceCase(str) {
                    if (!str) return '';
                    str = String(str).trim();
                    if (str.length === 0) return '';
                    const lower = str.toLowerCase();
                    return lower.replace(/(^\s*|[.!?]\s+)(.)/g, (match, separator, char) => {
                        return separator + char.toUpperCase();
                    });
                },
                toTitleCase(str) {
                    if (!str) return '';
                    str = String(str).trim();
                    if (str.length === 0) return '';
                    return str.toLowerCase().replace(/(^\s*|[.\s]+)(.)/g, (match, separator, char) => {
                        return separator + char.toUpperCase();
                    });
                },
                cleanText(text) {
                    if (!text) return '';
                    if (typeof text === 'string' && (text.startsWith('{') || text.startsWith('['))) {
                        return text;
                    }
                    let result = text;
                    if (text.includes(' ||| ')) {
                        const parts = text.split(' ||| ');
                        if (parts.length > 1) {
                            result = this.lang === 'en' ? parts[1].trim() : parts[0].trim();
                        }
                    } else {
                        let separator = null;
                        if (text.includes(' / ')) separator = ' / ';
                        else if (text.includes(' | ')) separator = ' | ';
                        else if (text.includes('/')) separator = '/';
                        else if (text.includes('|')) separator = '|';

                        if (separator) {
                            const parts = text.split(separator);
                            if (parts.length > 1) {
                                const p0 = parts[0].trim();
                                const p1 = parts[1].trim();

                                // Regex for detecting Vietnamese accented characters
                                const viRegex = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệđìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ]/i;
                                const hasViAccents0 = viRegex.test(p0);
                                const hasViAccents1 = viRegex.test(p1);

                                let vi = p0;
                                let en = p1;

                                if (hasViAccents1 && !hasViAccents0) {
                                    vi = p1;
                                    en = p0;
                                } else if (hasViAccents0 && !hasViAccents1) {
                                    vi = p0;
                                    en = p1;
                                } else {
                                    // Fallback: check common Vietnamese lowercase words/consonants
                                    const commonViWords = /\b(tôi|bạn|học|tuần|nhiệm|vụ|cốt|lõi|bổ|trợ|phụ|bài|nhật|ký|chiêm|nghiệm|định|kiến|thông|tin|mục|tiêu|chặng)\b/i;
                                    if (commonViWords.test(p1) && !commonViWords.test(p0)) {
                                        vi = p1;
                                        en = p0;
                                    } else if (commonViWords.test(p0) && !commonViWords.test(p1)) {
                                        vi = p0;
                                        en = p1;
                                    } else {
                                        vi = p0;
                                        en = p1;
                                    }
                                }
                                result = this.lang === 'en' ? en : vi;
                            }
                        }
                    }
                    return this.toSentenceCase(result);
                },

                showCheckModal: false,
                showDeleteModal: false,
                checkTask: null,
                checkFeedback: '',
                selectedSessionFilter: 'all',
                get uniqueSessions() {
                    const sessions = this.tasks
                        .map(t => t.contextLink)
                        .filter(link => link && link.trim() !== '');
                    return [...new Set(sessions)];
                },

                async init() {
                    this.$watch('lang', (newVal) => {
                        this.checkDeadlines();
                    });
                    this.pageLoading = true;
                    // Xóa cache cũ nếu có để giải phóng bộ nhớ
                    localStorage.removeItem(`thapsang_pdca_tasks_${this.user?.username || 'user'}`);

                    // Xóa cache API cho các endpoints nhiệm vụ/trò chuyện để tránh đệm/cache
                    if (window.caches) {
                        try {
                            const cache = await caches.open('thapsang-api-cache-v1');
                            const keys = await cache.keys();
                            for (const r of keys) {
                                if (r.url.includes('/api/v1/tasks') || r.url.includes('/api/v1/db/chats')) {
                                    await cache.delete(r);
                                }
                            }
                        } catch (e) {
                            console.warn('Failed to clear Cache API:', e);
                        }
                    }

                    this.tasks = [];

                    // Deduplicate immediately upon loading
                    this.deduplicateTasks();

                    // Luôn đồng bộ profile từ backend để sidebar hiển thị đúng tên/avatar
                    await this.refreshProfileFromBackend();

                    // Tải dữ liệu chính chủ từ server và đồng bộ ngược lên
                    await this.loadTasksFromServer();

                    // Sync tasks từ Coach AI Sessions
                    await this.syncFromCoach();

                    this.checkDeadlines();

                    // Trì hoãn nhẹ 400ms để hiệu ứng loading chuyển trang mượt mà
                    setTimeout(() => {
                        this.pageLoading = false;
                    }, 400);
                },

                deduplicateTasks() {
                    const clean = (str) => (str || "").normalize("NFC").substring(0, 255).replace(/[\s\r\n]+/g, ' ').trim().toLowerCase();
                    const seen = new Set();
                    const unique = [];
                    let hasDuplicates = false;
                    for (const t of this.tasks) {
                        const key = clean(t.title) + '|' + clean(t.contextLink);
                        if (seen.has(key)) {
                            hasDuplicates = true;
                            // Silently delete duplicate from server if it has a real DB id
                            if (t.id && !String(t.id).startsWith('cohort_')) {
                                fetch(`/api/v1/tasks/${t.id}`, { method: 'DELETE' }).catch(() => { });
                            }
                        } else {
                            seen.add(key);
                            unique.push(t);
                        }
                    }
                    this.tasks = unique;
                    if (hasDuplicates || this.tasks.length !== unique.length) {
                        this.saveToLocal();
                    }
                },

                async loadTasksFromServer() {
                    if (!this.user || !this.user.username) return;
                    try {
                        const res = await fetch(`/api/v1/tasks/${encodeURIComponent(this.user.email || this.user.username)}`);
                        if (res.ok) {
                            const serverTasks = await res.json();

                            // Migration block removed to prevent resurrecting deleted tasks

                            this.tasks = serverTasks;
                            this.deduplicateTasks();
                            this.checkDeadlines();
                        }
                    } catch (e) {
                        console.error("Lỗi tải tasks từ server:", e);
                    }
                },

                async syncFromCoach() {
                    if (!this.user || !this.user.username) return;
                    try {
                        const res = await fetch(`/api/v1/db/chats?username=${encodeURIComponent(this.user.email || this.user.username)}`);
                        if (res.ok) {
                            const chats = await res.json();
                            let isUpdated = false;
                            const clean = (str) => (str || "").normalize("NFC").substring(0, 255).replace(/[\s\r\n]+/g, ' ').trim().toLowerCase();

                            if (!this.syncingTasksLock) this.syncingTasksLock = new Set();

                            for (const chatId of Object.keys(chats)) {
                                const chat = chats[chatId];
                                let chatUpdated = false;
                                if (chat.tasks && chat.tasks.length > 0) {
                                    for (const t of chat.tasks) {
                                        if (t.synced) continue;

                                        let title = '';
                                        let goal = '';
                                        if (t.content_vi && t.content_en) {
                                            title = `${t.content_vi} ||| ${t.content_en}`;
                                        } else {
                                            title = typeof t === 'string' ? t : (t.content || '');
                                        }

                                        if (t.goal_vi && t.goal_en) {
                                            goal = `${t.goal_vi} ||| ${t.goal_en}`;
                                        } else {
                                            goal = typeof t === 'object' ? (t.goal || 'Được phân tích từ luồng suy nghĩ Socratic ||| Analyzed from Socratic dialogue') : 'Được phân tích từ luồng suy nghĩ Socratic ||| Analyzed from Socratic dialogue';
                                        }

                                        if (!title.trim()) continue;
                                        const exists = this.tasks.find(pt => {
                                            const ptTitle = clean(pt.title);
                                            const ptOriginal = clean(pt.originalContent);
                                            const cleanTTitle = clean(title);
                                            const cleanTVi = clean(t.content_vi || '');
                                            const cleanTEn = clean(t.content_en || '');
                                            const cleanTContent = clean(t.content || '');

                                            return ptTitle === cleanTTitle ||
                                                ptOriginal === cleanTTitle ||
                                                (cleanTVi && (ptTitle.includes(cleanTVi) || ptOriginal.includes(cleanTVi))) ||
                                                (cleanTEn && (ptTitle.includes(cleanTEn) || ptOriginal.includes(cleanTEn))) ||
                                                (cleanTContent && (ptTitle.includes(cleanTContent) || ptOriginal.includes(cleanTContent)));
                                        });

                                        if (exists) {
                                            t.synced = true;
                                            chatUpdated = true;
                                            continue;
                                        }

                                        if (!exists) {
                                            const aiMsgWithTitle = chat.chat_history?.find(m => m.title || m.reasoning);
                                            const sessionTitle = chat.custom_title || (aiMsgWithTitle ? (aiMsgWithTitle.title || aiMsgWithTitle.reasoning) : "Coach Session");

                                            // Không cho phép đồng bộ Task của lộ trình The Great Rebuild sang trang Task chung
                                            const sTitleLower = sessionTitle.toLowerCase();
                                            if (sTitleLower.includes("great rebuild") || sTitleLower.includes("tái thiết") || sTitleLower.includes("roadmap") || sTitleLower.includes("lộ trình")) {
                                                continue;
                                            }

                                            // Prevent concurrent POSTs
                                            const syncKey = clean(title) + '|' + clean(sessionTitle);
                                            if (this.syncingTasksLock.has(syncKey)) {
                                                t.synced = true;
                                                chatUpdated = true;
                                                continue;
                                            }
                                            this.syncingTasksLock.add(syncKey);

                                            const payload = {
                                                title: title,
                                                goal: goal,
                                                status: 'backlog',
                                                deadline: t.deadline || '',
                                                effort: 1,
                                                subtasks: [],
                                                contextLink: sessionTitle
                                            };
                                            try {
                                                const postRes = await fetch(`/api/v1/tasks/${encodeURIComponent(this.user.email || this.user.username)}`, {
                                                    method: 'POST',
                                                    headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify(payload)
                                                });
                                                if (postRes.ok) {
                                                    const data = await postRes.json();
                                                    const syncedTask = { ...data.task, originalContent: title };
                                                    this.tasks.push(syncedTask);

                                                    t.synced = true;
                                                    chatUpdated = true;
                                                    isUpdated = true;
                                                }
                                            } catch (err) {
                                                console.error("Lỗi lưu task đồng bộ lên server:", err);
                                            }
                                        }
                                    }
                                }

                                if (chatUpdated) {
                                    const singleChatPayload = {};
                                    singleChatPayload[chatId] = chat;
                                    try {
                                        await fetch('/api/v1/db/chats', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify(singleChatPayload)
                                        });
                                    } catch (e) { }
                                }
                            }

                            if (isUpdated) {
                                this.deduplicateTasks();
                                this.checkDeadlines();
                            }
                        }
                    } catch (e) {
                        console.error("Lỗi đồng bộ Tasks từ Coach:", e);
                    }
                },

                saveToLocal() {
                    const readIds = this.notifications.filter(n => n.read).map(n => n.id);
                    localStorage.setItem('thapsang_pdca_read_notifications', JSON.stringify(readIds));
                },

                // --- KANBAN LOGIC ---
                dragStart(id, ev) {
                    this.draggedTaskId = id;
                    ev.target.classList.add('dragging');
                    ev.dataTransfer.effectAllowed = 'move';
                },
                dragEnd(ev) {
                    ev.target.classList.remove('dragging');
                    this.dragOverCol = null;
                },
                async drop(statusCol) {
                    this.dragOverCol = null;
                    if (!this.draggedTaskId) return;

                    const idx = this.tasks.findIndex(t => t.id === this.draggedTaskId);
                    if (idx > -1) {
                        const oldStatus = this.tasks[idx].status;
                        if (oldStatus !== statusCol) {
                            const originalTask = JSON.parse(JSON.stringify(this.tasks[idx]));

                            // 1. Cập nhật trạng thái cục bộ ngay lập tức (Optimistic UI)
                            this.tasks[idx].status = statusCol;
                            this.saveToLocal();
                            this.checkDeadlines();

                            // Chuẩn bị payload đồng bộ
                            const updatePayload = { ...originalTask, status: statusCol };

                            // 2. Chạy ngầm việc đồng bộ hóa lên máy chủ
                            try {
                                const res = await fetch(`/api/v1/tasks/${this.draggedTaskId}`, {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(updatePayload)
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    // Cập nhật lại với dữ liệu chính xác từ máy chủ
                                    const currentIdx = this.tasks.findIndex(t => t.id === this.draggedTaskId);
                                    if (currentIdx > -1) {
                                        this.tasks[currentIdx] = data.task;
                                        this.saveToLocal();
                                        this.checkDeadlines();

                                        if (statusCol === 'done') {
                                            setTimeout(() => {
                                                if (!this.tasks[currentIdx].contextLink || !this.tasks[currentIdx].contextLink.toLowerCase().includes('lộ trình cá nhân')) {
                                                    this.openCheckModal(this.tasks[currentIdx]);
                                                }
                                            }, 200);
                                        }
                                    }
                                } else {
                                    showGlobalToast("Đồng bộ trạng thái thất bại. Đang khôi phục...", "error");
                                    // Khôi phục lại trạng thái cũ nếu lỗi
                                    const revertIdx = this.tasks.findIndex(t => t.id === this.draggedTaskId);
                                    if (revertIdx > -1) {
                                        this.tasks[revertIdx].status = oldStatus;
                                        this.saveToLocal();
                                        this.checkDeadlines();
                                    }
                                }
                            } catch (e) {
                                console.error("Lỗi cập nhật trạng thái:", e);
                                showGlobalToast("Mất kết nối máy chủ. Đang khôi phục...", "error");
                                // Khôi phục lại trạng thái cũ nếu lỗi kết nối
                                const revertIdx = this.tasks.findIndex(t => t.id === this.draggedTaskId);
                                if (revertIdx > -1) {
                                    this.tasks[revertIdx].status = oldStatus;
                                    this.saveToLocal();
                                    this.checkDeadlines();
                                }
                            }
                        }
                    }
                    this.draggedTaskId = null;
                },

                async addTask() {
                    const payload = {
                        title: 'Nhiệm vụ mới',
                        goal: '',
                        status: 'backlog',
                        deadline: '',
                        effort: 1,

                        });

                            this.saveToLocal();
                            this.openPlanModal(data.task);
                        } else {
                            showGlobalToast("Không thể tạo nhiệm vụ trên máy chủ.", "error");
                        }
                    } catch (e) {

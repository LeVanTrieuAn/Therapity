                        showGlobalToast("Không thể kết nối đến máy chủ.", "error");
                    }
                },

                // --- PLAN PHASE ---
                openPlanModal(task) {
                    this.selectedTask = JSON.parse(JSON.stringify(task)); // Deep copy

                    const splitBilingual = (str) => {
                        if (!str) return { vi: '', en: '' };
                        if (str.includes(' ||| ')) {
                            const parts = str.split(' ||| ');
                            return { vi: parts[0] || '', en: parts[1] || '' };
                        }
                        return { vi: str, en: str };
                    };

                    this.editTitle = splitBilingual(task.title);
                    this.editGoal = splitBilingual(task.goal);

                    this.editSubtasks = (task.subtasks || []).map(sub => {
                        return {
                            completed: sub.completed || false,
                            editTitle: splitBilingual(sub.title)
                        };
                    });

                    // Chụp ảnh nhanh trạng thái ban đầu của các trường thông tin để phát hiện thay đổi
                    this.planModalSnapshot = JSON.stringify({
                        title: this.editTitle,
                        goal: this.editGoal,
                        effort: this.selectedTask.effort,
                        deadline: this.selectedTask.deadline || '',
                        subtasks: this.editSubtasks,
                        status: this.selectedTask.status || '',
                        feedback: this.selectedTask.feedback || ''
                    });

                    this.showPlanModal = true;
                },
                checkDeadlines() {
                    this.notifications = [];
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    const savedRead = localStorage.getItem('thapsang_pdca_read_notifications');
                    const readIds = savedRead ? JSON.parse(savedRead) : [];

                    this.tasks.forEach(task => {
                        if (task.status !== 'done' && task.deadline) {
                            const due = new Date(task.deadline.replace(/-/g, '/'));
                            due.setHours(0, 0, 0, 0);

                            const diffTime = due.getTime() - today.getTime();
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                            if (diffDays >= 0 && diffDays <= 1) {
                                let msg = '';
                                if (diffDays === 0) {
                                    msg = this.lang === 'en'
                                        ? `Task "${this.cleanText(task.title)}" is due TODAY! Complete it now.`
                                        : `Nhiệm vụ "${this.cleanText(task.title)}" HẾT HẠN HÔM NAY! Mau chóng hoàn thành.`;
                                } else {
                                    msg = this.lang === 'en'
                                        ? `Task "${this.cleanText(task.title)}" is due tomorrow (${task.deadline}).`
                                        : `Nhiệm vụ "${this.cleanText(task.title)}" sắp hết hạn ngày mai (${task.deadline}), hãy hoàn thành sớm.`;
                                }

                                this.notifications.push({
                                    id: task.id,
                                    task: task,
                                    message: msg,
                                    type: 'warning',
                                    time: diffDays === 0
                                        ? (this.lang === 'en' ? 'Today' : 'Hôm nay')
                                        : (this.lang === 'en' ? 'Tomorrow' : 'Ngày mai'),
                                    read: readIds.includes(task.id)
                                });
                            } else if (diffDays < 0) {
                                const overdueDays = Math.abs(diffDays);
                                const msg = this.lang === 'en'
                                    ? `Task "${this.cleanText(task.title)}" is overdue by ${overdueDays} day(s)!`
                                    : `Nhiệm vụ "${this.cleanText(task.title)}" đã trễ hạn ${overdueDays} ngày!`;

                                this.notifications.push({
                                    id: task.id,
                                    task: task,
                                    message: msg,
                                    type: 'error',
                                    time: this.lang === 'en' ? 'Overdue' : 'Quá hạn',
                                    read: readIds.includes(task.id)
                                });
                            }
                        }
                    });
                },
                async triggerAiMicrosteps() {
                    if (!this.selectedTask) return;

                    const joinBilingual = (obj) => {
                        const vi = (obj.vi || '').trim();
                        const en = (obj.en || '').trim();
                        if (vi && en) return `${vi} ||| ${en}`;
                        return vi || en || '';
                    };

                    const title = joinBilingual(this.editTitle);
                    const goal = joinBilingual(this.editGoal);
                    const effort = parseInt(this.selectedTask.effort) || 1;
                    if (effort < 1) return;

                    this.generatingMicrosteps = true;
                    try {
                        const res = await fetch('/api/v1/tasks/generate-microsteps', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                title: title,
                                goal: goal,
                                effort: effort,
                                lang: this.lang
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data && Array.isArray(data.subtasks)) {
                                const splitBilingual = (str) => {
                                    if (!str) return { vi: '', en: '' };
                                    if (str.includes(' ||| ')) {
                                        const parts = str.split(' ||| ');
                                        return { vi: parts[0] || '', en: parts[1] || '' };
                                    }
                                    return { vi: str, en: str };
                                };
                                this.editSubtasks = data.subtasks.map(sub => {
                                    return {
                                        completed: sub.completed || false,
                                        editTitle: splitBilingual(sub.title)
                                    };
                                });
                                showGlobalToast(
                                    this.lang === 'vi' ? 'Đã tự động sinh các bước nhỏ bằng AI!' : 'Auto-generated subtasks using AI!',
                                    'success'
                                );
                            }
                        } else {
                            console.error("Failed to generate microsteps via AI.");
                            showGlobalToast(
                                this.lang === 'vi' ? 'Không thể kết nối dịch vụ AI. Đang tự động phân rã bước...' : 'Could not reach AI service. Auto-deconstructing steps...',
                                'info'
                            );
                        }
                    } catch (e) {
                        console.error("Error generating microsteps:", e);
                    } finally {
                        this.generatingMicrosteps = false;
                    }
                },
                async quickMoveStatus() {
                    if (!this.selectedTask) return;
                    if (this.selectedTask.status === 'backlog') {
                        this.selectedTask.status = 'in_progress';
                    } else if (this.selectedTask.status === 'in_progress') {
                        this.selectedTask.status = 'done';
                    }
                    await this.savePlan();
                },
                async savePlan() {
                    const originalTasksList = JSON.parse(JSON.stringify(this.tasks));

                    try {
                        // So sánh trạng thái hiện tại với trạng thái ban đầu (Snapshot)
                        const currentState = JSON.stringify({
                            title: this.editTitle,
                            goal: this.editGoal,
                            effort: this.selectedTask.effort,
                            deadline: this.selectedTask.deadline || '',
                            subtasks: this.editSubtasks,
                            status: this.selectedTask.status || '',
                            feedback: this.selectedTask.feedback || ''
                        });

                        const hasChanges = this.planModalSnapshot !== currentState;
                        if (!hasChanges) {
                            // Không có thay đổi gì, đóng modal lặng lẽ mà không gọi API hay hiện Toast
                            this.showPlanModal = false;
                            return;
                        }
                        const joinBilingual = (obj) => {
                            const vi = this.toSentenceCase(obj.vi || '');
                            const en = this.toSentenceCase(obj.en || '');
                            if (vi && en) return `${vi} ||| ${en}`;
                            return vi || en || '';
                        };

                        // 1. Chuẩn bị dữ liệu cập nhật
                        const updatedTitle = joinBilingual(this.editTitle);
                        const updatedGoal = joinBilingual(this.editGoal);
                        const updatedSubtasks = this.editSubtasks.map(sub => {
                            return {
                                title: joinBilingual(sub.editTitle),
                                completed: sub.completed
                            };
                        });

                        // 2. Cập nhật selectedTask
                        this.selectedTask.title = updatedTitle;
                        this.selectedTask.goal = updatedGoal;
                        this.selectedTask.subtasks = updatedSubtasks;

                        // 3. Cập nhật danh sách nhiệm vụ cục bộ (Optimistic UI)
                        const idx = this.tasks.findIndex(t => t.id === this.selectedTask.id);
                        if (idx > -1) {
                            this.tasks[idx] = {
                                ...this.tasks[idx],
                                title: updatedTitle,
                                goal: updatedGoal,
                                subtasks: updatedSubtasks,
                                deadline: this.selectedTask.deadline,
                                effort: this.selectedTask.effort,
                                status: this.selectedTask.status,
                                feedback: this.selectedTask.feedback || ''
                            };
                        }

                        // 4. Đóng modal, hiển thị thông báo thành công và cập nhật UI ngay lập tức
                        this.showPlanModal = false;
                        const toastMsg = this.selectedTask.status === 'done'
                            ? (this.lang === 'en' ? "Reflection saved!" : "Đã lưu cảm nghĩ!")
                            : (this.lang === 'en' ? "Plan saved successfully!" : "Đã lưu kế hoạch thành công!");
                        showGlobalToast(toastMsg, "success");
                        this.saveToLocal();
                        this.checkDeadlines();

                        // 5. Đồng bộ hóa ngầm lên máy chủ
                        const res = await fetch(`/api/v1/tasks/${this.selectedTask.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.selectedTask)
                        });

                        if (res.ok) {
                            const data = await res.json();
                            const finalIdx = this.tasks.findIndex(t => t.id === this.selectedTask.id);
                            if (finalIdx > -1) {
                                this.tasks[finalIdx] = data.task;
                                this.saveToLocal();
                                this.checkDeadlines();
                                if (data.task.status === 'done' && (!data.task.contextLink || !data.task.contextLink.toLowerCase().includes('lộ trình cá nhân'))) {
                                    this.openCheckModal(data.task);
                                }
                            }
                        } else {
                            console.error("Không thể đồng bộ kế hoạch lên máy chủ.");
                            showGlobalToast("Không thể đồng bộ với máy chủ. Đang khôi phục...", "error");
                            this.tasks = originalTasksList;
                            this.saveToLocal();
                            this.checkDeadlines();
                        }
                    } catch (e) {
                        console.error("Lỗi đồng bộ kế hoạch:", e);
                        showGlobalToast("Mất kết nối máy chủ. Đang khôi phục...", "error");
                        this.tasks = originalTasksList;
                        this.saveToLocal();
                        this.checkDeadlines();
                    }
                },

                // --- CHECK & ACT PHASE ---
                openCheckModal(task) {
                    this.checkTask = task;
                    this.checkFeedback = '';
                    this.showCheckModal = true;
                },
                async submitCheck() {
                    if (this.checkTask) {
                        this.checkTask.feedback = this.checkFeedback;

                        // Optimistic UI update locally
                        const idx = this.tasks.findIndex(t => t.id === this.checkTask.id);
                        if (idx > -1) {
                            this.tasks[idx].feedback = this.checkFeedback;
                            this.saveToLocal();
                        }
                    }

                    this.showCheckModal = false;
                    showGlobalToast(this.lang === 'en' ? "Reflection saved!" : "Đã lưu cảm nghĩ!", "success");

                    try {
                        const res = await fetch(`/api/v1/tasks/${this.checkTask.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.checkTask)
                        });
                        if (!res.ok) {
                            console.error("Lỗi lưu phản hồi AI check-in trên server.");
                        }
                    } catch (e) {
                        console.error("Lỗi lưu phản hồi AI check-in:", e);
                    }
                },
                actReplan() {
                    this.showCheckModal = false;
                    this.checkTask.status = 'backlog';
                    // Open Plan modal to break down task
                    this.openPlanModal(this.checkTask);
                },
                actPublish() {
                    this.showCheckModal = false;

                    if (this.checkTask) {
                        this.checkTask.feedback = this.checkFeedback;

                        // Optimistic UI update locally
                        const idx = this.tasks.findIndex(t => t.id === this.checkTask.id);
                        if (idx > -1) {
                            this.tasks[idx].feedback = this.checkFeedback;
                            this.saveToLocal();
                        }

                        fetch(`/api/v1/tasks/${this.checkTask.id}`, {
                            method: 'PATCH',
                            keepalive: true,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.checkTask)
                        }).catch(e => console.error("Lỗi lưu phản hồi vào task:", e));
                    } else {
                        this.saveToLocal();
                    }

                    // Optimistic UI: Show success toast immediately
                    showGlobalToast(this.lang === 'en' ? "Successfully posted to AOA Feed community!" : "Đã đăng lên cộng đồng AOA Feed thành công!", "success");

                    // Optimistic API Call: runs in the background
                    fetch('/api/v1/aoa/posts', {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            author_name: this.user.username,
                            author_displayName: this.user.displayName || this.user.username,
                            author_avatar: this.user.avatar || "",
                            content: this.lang === 'en'
                                ? `Completed: **${this.cleanText(this.checkTask.title)}**\n\n---\n\n💡 **Reflection:**\n${this.checkFeedback}\n\n#Task #Thapsang`
                                : `Đã hoàn thành: **${this.cleanText(this.checkTask.title)}**\n\n---\n\n💡 **Đánh giá cá nhân:**\n${this.checkFeedback}\n\n#Task #Thapsang`,
                            graph_data: {},
                            post_privacy: "public"
                        })
                    }).then(res => {
                        if (!res.ok) {
                            showGlobalToast(this.lang === 'en' ? "An error occurred while posting." : "Có lỗi xảy ra khi đăng bài ngầm.", "error");
                        }
                    }).catch(e => {
                        console.error("Lỗi khi đăng lên AOA:", e);
                        showGlobalToast(this.lang === 'en' ? "Cannot connect to the server." : "Không thể kết nối đến máy chủ khi đăng ngầm.", "error");
                    });
                },

                async refreshProfileFromBackend() {
                    if (!this.user || !this.user.username) return;
                    try {
                        const res = await fetch(`/api/v1/auth/profile/${encodeURIComponent(this.user.email || this.user.username)}?_t=${Date.now()}`);
                        if (res.ok) {
                            const profile = await res.json();
                            this.user = {
                                ...this.user,
                                displayName: profile.displayName || this.user.displayName,
                                bio: profile.bio || this.user.bio,
                                avatar: profile.avatar || this.user.avatar,
                                banner: profile.banner || this.user.banner,
                                following_list: profile.following_list || this.user.following_list || []
                            };
                            localStorage.setItem('thapsang_user', JSON.stringify(this.user));
                        }
                    } catch (e) {
                        console.error("Không thể tải hồ sơ từ máy chủ:", e);
                    }
                },

                logout() {
                    const keys = Object.keys(localStorage);
                    keys.forEach(k => {
                        if (k.startsWith('thapsang_cohort_') || k.startsWith('optimistic_aoa_posts') || k === 'thapsang_user' || k === 'thapsang_remembered_email') {
                            localStorage.removeItem(k);
                        }
                    });
                    window.location.href = '/';
                }
            }
        }
    </script>
</body>

</html>

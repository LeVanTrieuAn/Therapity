                async _fetchChat() {
                    if (this.chatAbortController) {
                        this.chatAbortController.abort();
                    }
                    this.chatAbortController = new AbortController();
                    const currentController = this.chatAbortController;

                    try {
                        const totalUserMsgs = this.chatHistory.filter(m => m.role === 'user').length;
                        const res = await fetch('/api/v1/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.user.username,
                                messages: this.chatHistory.filter(m => !m.is_deleted).slice(-20).map(m => ({ role: m.role, content: m.content })),
                                total_user_messages: totalUserMsgs,
                                session_id: this.currentChatId,
                                voice: this.selectedVoiceName
                            }),
                            signal: this.chatAbortController.signal,
                            keepalive: true
                        });

                        let data;
                        try {
                            data = await res.json();
                        } catch (err) {
                            if (!res.ok) {
                                if (res.status === 504) throw new Error("Máy chủ AI phản hồi quá lâu (Timeout). Vui lòng thử lại sau.");
                                throw new Error(`Lỗi hệ thống (${res.status}): Không thể kết nối tới AI.`);
                            }
                            throw new Error("Lỗi định dạng dữ liệu từ máy chủ.");
                        }
                        if (!res.ok) {
                            throw new Error(data.detail || "Lỗi hệ thống AI");
                        }

                        this.tokenUsed = (this.tokenUsed || 0) + (data.token_used || 0);
                        this.modelUsed = data.model_used || this.modelUsed || "";

                        this.chatHistory.push({
                            id: 'msg_model_' + Date.now() + '_' + Math.random(),
                            role: 'model',
                            content: data.question || "...",
                            reasoning: data.reasoning,
                            title: data.title,
                            isTyped: false,
                            isError: false
                        });

                        // Mindmap generation has been moved to a separate API call
                        if (data.tasks && data.tasks.length > 0) {
                            data.tasks.forEach(t => {
                                const contentVi = typeof t === 'object' ? (t.content_vi || '') : '';
                                const contentEn = typeof t === 'object' ? (t.content_en || '') : '';
                                const content = typeof t === 'string' ? t : (t.content || contentVi || contentEn || '');

                                const goalVi = typeof t === 'object' ? (t.goal_vi || '') : '';
                                const goalEn = typeof t === 'object' ? (t.goal_en || '') : '';
                                const goal = typeof t === 'object' ? (t.goal || goalVi || goalEn || '') : '';

                                if (!this.tasks.find(task => (task.content && (task.content && content && task.content.normalize("NFC") === content.normalize("NFC"))) || (task.content_vi && (task.content_vi && contentVi && task.content_vi.normalize("NFC") === contentVi.normalize("NFC"))))) {
                                    this.tasks.push({ ...t, content, goal, completed: false, is_new: true });
                                }
                            });
                            this.hasNewTask = true;
                        }

                        if (data.suggested_replies && Array.isArray(data.suggested_replies)) {
                            this.suggestedReplies = data.suggested_replies;
                        }

                        if (data.ask_diary_consent) {
                            if (this.diaryAutoConsent) {
                                this.triggerDiaryGeneration();
                                this.triggerToast(window.t('coach.diary_consent_toast'), window.t('coach.diary_consent_toast'), 'success');
                            } else {
                                this.chatHistory.push({
                                    id: 'msg_diary_consent_' + Date.now(),
                                    role: 'system_diary_consent',
                                    isTyped: false,
                                    isError: false
                                });
                            }
                        }

                        this.renderTree(); // Still render tree to maintain current visual state
                        this.saveAll();
                        
                        // Async generate Mindmap without blocking user
                        this.generateMindmap();
                    } catch (e) {
                        if (e.name === 'AbortError') {
                            console.log('Chat fetch aborted by a newer request.');
                            return; // Do nothing if it was intentionally aborted
                        }
                        console.error("Chat error", e);
                        this.chatHistory.push({
                            id: 'msg_error_' + Date.now() + '_' + Math.random(),
                            role: 'model',
                            content: this.lang === 'en' ? "There was a glitch while processing your request, please try again." : "Có trục trặc trong lúc tiếp nhận thông tin của bạn, vui lòng thử lại nhé",
                            isError: true,
                            isTyped: true
                        });
                    } finally {
                        if (this.chatAbortController === currentController) {
                            this.isLoading = false;
                            this.$nextTick(() => {
                                const el = document.getElementById('chat-history');
                                if (el) el.scrollTop = el.scrollHeight;
                            });
                        }
                    }
                },

                async sendMessage() {
                    if (!this.userInput.trim() || this.isLoading) return;

                    const content = this.userInput;
                    this.userInput = '';
                    this.chatHistory.push({
                        id: 'msg_user_' + Date.now() + '_' + Math.random(),
                        role: 'user',
                        content
                    });
                    this.isLoading = true;
                    this.suggestedReplies = [];

                    this.$nextTick(() => {
                        const el = document.getElementById('chat-history');
                        el.scrollTop = el.scrollHeight;
                    });

                    // Fire saveAll immediately. Only await if it's a temp ID to guarantee the DB creates the real ID first.
                    if (this.currentChatId.startsWith("temp_")) {
                        await this.saveAll();
                    } else {
                        // Fire and forget to eliminate network delay
                        this.saveAll();
                    }

                    // Do not block the function
                    this._fetchChat();
                },

                async generateMindmap() {
                    if (this.mindmapLoading) return;
                    this.mindmapLoading = true;
                    this.mindmapError = null;
                    
                    try {
                        const res = await fetch('/api/v1/chat/mindmap', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.user.username,
                                messages: this.chatHistory.filter(m => !m.is_deleted).slice(-20).map(m => ({ role: m.role, content: m.content })),
                                model: this.modelUsed,
                                session_id: this.currentChatId,
                                graph_data: this.graphData
                            })
                        });
                        
                        if (!res.ok) {
                            throw new Error("Lỗi khi kết nối tới máy chủ tạo bản đồ tư duy.");
                        }
                        
                        const data = await res.json();
                        
                        if (data.nodes) {
                            data.nodes.forEach(n => {
                                const idx = this.graphData.nodes.findIndex(node => node.id === n.id);
                                if (idx > -1) {
                                    this.graphData.nodes[idx] = { ...this.graphData.nodes[idx], ...n };
                                } else {
                                    this.graphData.nodes.push(n);
                                }
                            });
                        }
                        if (data.edges) {
                            data.edges.forEach(e => {
                                const key = `${e.source}-${e.target}`;
                                const idx = this.graphData.edges.findIndex(edge => `${edge.source}-${edge.target}` === key);
                                if (idx > -1) {
                                    this.graphData.edges[idx] = { ...this.graphData.edges[idx], ...e };
                                } else {
                                    this.graphData.edges.push(e);
                                }
                            });
                        }
                        
                        this.renderTree();
                        this.saveAll(); // Save updated graph data
                        
                    } catch (err) {
                        console.error("Mindmap Generation Error:", err);
                        this.mindmapError = this.lang === 'vi' ? 'Không thể tải bản đồ tư duy.' : 'Cannot load mind map.';
                    } finally {
                        this.mindmapLoading = false;
                    }
                },

                async regenerateResponse(msg) {
                    if (this.isLoading) return;

                    const idx = this.chatHistory.findIndex(m => m.id === msg.id);
                    if (idx === -1) return;

                    // Trigger CSS sliding animation
                    this.chatHistory[idx].isRegenerating = true;

                    // Wait for CSS animation
                    await new Promise(r => setTimeout(r, 300));

                    // Remove the current AI message
                    this.chatHistory.splice(idx, 1);

                    this.isLoading = true;
                    this.suggestedReplies = [];

                    // Resend the request
                    await this._fetchChat();
                },

                async syncTasksContext(oldTitle, newTitle, isDelete) {
                    if (!oldTitle) return;
                    const username = this.user.email || this.user.username;
                    try {

                        // Server update
                        const res = await fetch(`/api/v1/tasks/${encodeURIComponent(username)}`);
                        if (res.ok) {
                            const serverTasks = await res.json();
                            const tasksToUpdate = serverTasks.filter(t => t.contextLink === oldTitle);

                            for (const task of tasksToUpdate) {
                                if (isDelete) {
                                    fetch(`/api/v1/tasks/${task.id}`, { method: 'DELETE' }).catch(() => { });
                                } else {
                                    const updatedTask = { ...task, contextLink: newTitle };
                                    fetch(`/api/v1/tasks/${task.id}`, {
                                        method: 'PATCH',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify(updatedTask)
                                    }).catch(() => { });
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Lỗi đồng bộ tasks context:", e);
                    }
                },

                deleteSession() {
                    if (!this.sessionToDelete) return;
                    const targetId = this.sessionToDelete;
                    const wasCurrent = (this.currentChatId === targetId);

                    const sessionIndex = this.sessions.findIndex(s => s.id === targetId);
                    const oldTitle = sessionIndex !== -1 ? this.sessions[sessionIndex].title : null;

                    // Optimistic update
                    this.sessions = this.sessions.filter(s => s.id !== targetId);
                    this.showDeleteConfirm = false;
                    this.sessionToDelete = null;

                    if (wasCurrent) {
                        this.createNewChat();
                    }

                    this.triggerToast('Đã xóa phiên thảo luận thành công', 'Session deleted successfully', 'success');

                    // Background sync
                    fetch(`/api/v1/db/chats/${targetId}`, {
                        method: 'DELETE'
                    }).catch(e => console.error("Lỗi khi xóa session:", e));

                    if (oldTitle) {
                        this.syncTasksContext(oldTitle, null, true);
                    }
                },

                saveSessionTitle() {
                    if (!this.editingSessionId) return;
                    const targetId = this.editingSessionId;
                    const newTitle = this.editingTitle;

                    // Optimistic update
                    const sessionIndex = this.sessions.findIndex(s => s.id === targetId);
                    const oldTitle = sessionIndex !== -1 ? this.sessions[sessionIndex].title : null;

                    if (sessionIndex !== -1) {
                        this.sessions[sessionIndex].title = newTitle;
                    }
                    this.editingSessionId = null;

                    this.triggerToast('Đã đổi tên thành công', 'Renamed successfully', 'success');

                    // Background sync
                    fetch(`/api/v1/db/chats?username=${encodeURIComponent(this.user.email || this.user.username)}&_t=${Date.now()}`)
                        .then(res => res.json())
                        .then(chats => {
                            const targetChat = chats[targetId];
                            if (targetChat) {
                                targetChat.custom_title = newTitle;
                                const singleChatPayload = {};
                                singleChatPayload[targetId] = targetChat;

                                fetch('/api/v1/db/chats', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(singleChatPayload)
                                });
                            }
                        })
                        .catch(e => console.error("Lỗi khi lưu tiêu đề:", e));

                    if (oldTitle && oldTitle !== newTitle) {
                        this.syncTasksContext(oldTitle, newTitle, false);
                    }
                },

                saveEditedMessage(msg) {
                    const cleanOld = msg.content.replace(/ \(đã sửa tin nhắn\)$| \(edited\)$/i, '');
                    const cleanNew = msg.editContent.trim();

                    if (cleanOld === cleanNew) {
                        msg.isEditing = false;
                        return;
                    }

                    const originalContent = msg.content;
                    const originalIsEdited = msg.is_edited;

                    // Append suffix for DB save
                    const suffix = this.lang === 'vi' ? ' (đã sửa tin nhắn)' : ' (edited)';

                    // Optimistic update
                    msg.content = cleanNew + suffix;
                    msg.is_edited = true;
                    msg.isEditing = false;

                    this.triggerToast('Đã cập nhật tin nhắn', 'Message updated', 'success');

                    // Background sync with rollback
                    this.saveAll().catch(e => {
                        console.error("Save message error", e);
                        msg.content = originalContent;
                        msg.is_edited = originalIsEdited;
                        this.triggerToast('Lưu thất bại. Đã khôi phục tin nhắn.', 'Save failed. Restored message.', 'error');
                    });
                },

                deleteMessage(msg) {
                    const originalContent = msg.content;
                    const originalIsDeleted = msg.is_deleted;

                    const suffix = this.lang === 'vi' ? ' (đã xóa)' : ' (deleted)';
                    msg.content = msg.content + suffix;
                    msg.is_deleted = true;

                    this.triggerToast(this.lang === 'vi' ? 'Đã xóa tin nhắn' : 'Message removed', this.lang === 'vi' ? 'Tin nhắn đã được xóa khỏi giao diện' : 'Message has been removed from UI', 'success');

                    // Background sync with rollback
                    this.saveAll().catch(e => {
                        console.error("Delete message error", e);
                        msg.content = originalContent;
                        msg.is_deleted = originalIsDeleted;
                        this.triggerToast('Xóa thất bại. Đã khôi phục tin nhắn.', 'Delete failed. Restored message.', 'error');
                    });
                },

                publishPost() {
                    this.postStatus = '';
                    this.showPublishModal = true;
                    this.$nextTick(() => {
                        const editor = document.getElementById('post-status-editor');
                        if (editor) editor.innerHTML = '';
                        this.initPreviewNetwork();
                    });
                },

                syncPostStatus() {
                    const editor = document.getElementById('post-status-editor');
                    if (editor) {
                        let html = editor.innerHTML;
                        // 1. Convert hashtag spans to [[#tag]]
                        let text = html.replace(/<span[^>]*class="[^"]*text-blue-400[^"]*"[^>]*>(#[^<]*)<\/span>/g, '[[$1]]');
                        // 2. Handle line breaks
                        text = text.replace(/<br\s*\/?>/g, '\n');
                        text = text.replace(/<\/div>/g, '\n');
                        text = text.replace(/<div[^>]*>/g, '');
                        // 3. Strip all other tags
                        text = text.replace(/<[^>]*>/g, '');
                        // 4. Unescape common entities
                        text = text.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');

                        this.postStatus = text.trim();
                    }
                },

                handleEditorKeydown(e) {
                    const editor = e.target;

                    if (e.key === ',' || e.key === 'Enter') {
                        const selection = window.getSelection();
                        if (!selection.rangeCount) return;

                        const range = selection.getRangeAt(0);
                        const node = range.startContainer;
                        if (node.nodeType !== Node.TEXT_NODE) return;

                        const text = node.textContent;
                        const offset = range.startOffset;
                        const textBefore = text.substring(0, offset);

                        const hashIndex = textBefore.lastIndexOf('#');
                        if (hashIndex !== -1) {
                            const hashtagText = textBefore.substring(hashIndex);
                            if (hashtagText.length > 1) {
                                e.preventDefault();

                                // Create hashtag span
                                const span = document.createElement('span');
                                span.className = 'text-blue-400 font-bold';
                                span.style.margin = '0 2px';
                                span.textContent = hashtagText;
                                span.contentEditable = 'false';

                                // Replace text with span
                                const newRange = document.createRange();
                                newRange.setStart(node, hashIndex);
                                newRange.setEnd(node, offset);
                                newRange.deleteContents();
                                newRange.insertNode(span);

                                const space = document.createTextNode('\u00A0');
                                span.after(space);

                                // Move cursor
                                const finalRange = document.createRange();
                                finalRange.setStartAfter(space);
                                finalRange.collapse(true);
                                selection.removeAllRanges();
                                selection.addRange(finalRange);

                                this.syncPostStatus();
                            }
                        }
                    }

                    if (e.key === 'Backspace') {
                        const selection = window.getSelection();
                        if (!selection.rangeCount) return;

                        const range = selection.getRangeAt(0);
                        if (range.startOffset === 0) {
                            let prevNode = range.startContainer.previousSibling;
                            if (prevNode && prevNode.nodeName === 'SPAN' && prevNode.classList.contains('text-blue-400')) {
                                e.preventDefault();
                                prevNode.remove();
                                this.syncPostStatus();
                            }
                        }
                    }
                },

                initPreviewNetwork() {
                    this.$nextTick(async () => {
                        const ready = await this.ensureMindMapLibrary();
                        if (!ready) return;
                        window.renderBinaryTreeGraph('publish-preview-network', this.graphData, { interactive: true, fitToView: true });
                    });
                },

                confirmPublish() {
                    if (this.isLoading) return;

                    // Optimistic UI: Show success immediately
                    this.showPublishModal = false;
                    this.showSuccessModal = true;

                    // Background upload
                    const payload = {
                        author_name: this.user.username,
                        author_displayName: this.user.displayName || this.user.username,
                        author_avatar: this.user.avatar || "",
                        content: this.postStatus,
                        graph_data: this.graphData,
                        post_privacy: this.postPrivacy
                    };

                    const tempId = 'temp-coach-' + Date.now();
                    const optimisticPosts = JSON.parse(localStorage.getItem('optimistic_aoa_posts') || '[]');
                    optimisticPosts.push({
                        id: tempId,
                        ...payload,
                        timestamp: new Date().toISOString(),
                        likes: 0,
                        shares: 0,
                        comments: [],
                        post_status: 'active',
                        _optimistic_expires: Date.now() + 30000 // expires in 30 seconds
                    });
                    localStorage.setItem('optimistic_aoa_posts', JSON.stringify(optimisticPosts));

                    fetch('/api/v1/aoa/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true
                    }).then(() => {
                        const current = JSON.parse(localStorage.getItem('optimistic_aoa_posts') || '[]');
                        localStorage.setItem('optimistic_aoa_posts', JSON.stringify(current.filter(p => p.id !== tempId)));
                    }).catch(e => {
                        console.error("Publish error", e);
                        const current = JSON.parse(localStorage.getItem('optimistic_aoa_posts') || '[]');
                        localStorage.setItem('optimistic_aoa_posts', JSON.stringify(current.filter(p => p.id !== tempId)));
                    });
                },

                async saveAll() {
                    const singleChatPayload = {};
                    singleChatPayload[this.currentChatId] = {
                        username: this.user.username || this.user.email || "",
                        email: this.user.email || this.user.username || "",
                        chat_history: this.chatHistory,
                        graph_data: this.graphData,
                        tasks: this.tasks,
                        has_new_task: this.hasNewTask,
                        suggested_replies: this.suggestedReplies,
                        token_used: this.tokenUsed,
                        model_used: this.modelUsed,
                        voice: this.selectedVoiceName
                    };

                    const postRes = await fetch('/api/v1/db/chats', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(singleChatPayload),
                        keepalive: true
                    });

                    if (postRes.ok) {
                        const postData = await postRes.json();
                        if (postData.saved_ids && postData.saved_ids[this.currentChatId]) {
                            this.currentChatId = postData.saved_ids[this.currentChatId];
                        }
                    }

                    // Fetch fresh chats from the server to guarantee perfect sync of generated Snowflake IDs
                    const freshRes = await fetch(`/api/v1/db/chats?username=${encodeURIComponent(this.user.email || this.user.username)}&_t=${Date.now()}`);
                    const freshChats = await freshRes.json();
                    this.allChats = freshChats;

                    // Refresh sessions list using the fresh chats
                    this.sessions = Object.keys(freshChats).filter(id => {
                        const chatUser = freshChats[id].username || freshChats[id].email;
                        const currentUser = this.user.username || this.user.email;
                        return chatUser && currentUser && chatUser.toLowerCase() === currentUser.toLowerCase();
                    }).map(id => {
                        const aiMsgWithTitle = freshChats[id].chat_history?.find(m => m.title || m.reasoning);
                        const defaultTitle = aiMsgWithTitle ? (aiMsgWithTitle.title || aiMsgWithTitle.reasoning) : "Cuộc hội thoại mới";
                        return {
                            id: id.toString(),
                            title: freshChats[id].custom_title || defaultTitle,
                            created_at: freshChats[id].created_at
                        };
                    }).sort((a, b) => b.id.localeCompare(a.id));
                },

                formatSessionDate(session) {
                    if (session.created_at) {
                        return window.formatDateTime(session.created_at);
                    }
                    if (session.id && session.id.startsWith("temp_")) {
                        const ts = parseInt(session.id.replace("temp_", ""));
                        return window.formatDateTime(ts);
                    }
                    // Fallback to Snowflake parser if created_at is somehow empty but not temp
                    if (session.id && /^\d+$/.test(session.id)) {
                        const num = parseInt(session.id);
                        if (num > 1000000000000 && num < 5000000000000) {
                            return window.formatDateTime(num);
                        }
                    }
                    return '';
                },

                goToTasks() {
                    this.showTasksModal = true;
                    this.loadTaskStatuses();
                },

                async loadTaskStatuses() {
                    if (!this.user || (!this.user.username && !this.user.email)) return;
                    try {
                        const res = await fetch(`/api/v1/tasks/${encodeURIComponent(this.user.email || this.user.username)}`);
                        if (res.ok) {
                            const serverTasks = await res.json();
                            const clean = (str) => (str || "").normalize("NFC").substring(0, 255).replace(/[\s\r\n]+/g, ' ').trim().toLowerCase();

                            this.tasks = this.tasks.map(t => {
                                const titleToMatch = clean(t.content || t.title);
                                const serverTask = serverTasks.find(st => {
                                    const stTitle = clean(st.title);
                                    const stOriginal = clean(st.originalContent || '');
                                    return stTitle.includes(titleToMatch) || titleToMatch.includes(stTitle) ||
                                        (stOriginal && (stOriginal.includes(titleToMatch) || titleToMatch.includes(stOriginal)));
                                });
                                return {
                                    ...t,
                                    current_status: serverTask ? (serverTask.status || 'backlog') : 'backlog',
                                    is_deleted_on_server: t.synced && !serverTask
                                };
                            });
                        }
                    } catch (e) {
                        console.error("Lỗi tải tasks từ server:", e);
                    }
                },

                checkAllTasksViewed() {
                    if (!this.tasks.some(t => t.is_new)) {
                        this.hasNewTask = false;
                        this.saveAll().catch(e => {
                            console.error("Lỗi khi lưu trạng thái tắt nhấp nháy nhiệm vụ:", e);
                        });
                    }
                },

                markAllTasksViewed() {
                    this.tasks.forEach(t => t.is_new = false);
                    this.checkAllTasksViewed();
                },

                markTaskViewed(task) {
                    if (task.is_new) {
                        task.is_new = false;
                        this.checkAllTasksViewed();
                    }
                },

                // ── Binary Tree Renderer ────────────────────────────────────────

                async initTree() {
                    const ready = await this.ensureMindMapLibrary();
                    if (!ready) return;
                    window.renderBinaryTreeGraph('mindmap', this.graphData, { interactive: true });
                },

                renderTree() {
                    this.initTree();
                },

                centerTree() {
                    this.initTree();
                }
            };
        }
    </script>
    <!-- Delete Confirmation Modal -->
    <template x-if="showDeleteConfirm">
        <div class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/60 ">
            <div
                class="glass-panel w-full max-w-sm rounded-2xl p-6 flex flex-col gap-6 shadow-2xl border border-white/10 animate-in fade-in zoom-in duration-200">
                <div class="flex flex-col items-center text-center gap-4">
                    <div
                        class="w-16 h-16 rounded-full bg-error/10 border border-error/20 flex items-center justify-center mb-2">
                        <span class="material-symbols-outlined text-error text-3xl">delete_forever</span>
                    </div>
                    <h3 class="font-headline-md text-xl text-on-surface"
                        x-text="lang === 'vi' ? 'Xóa lịch sử trò chuyện?' : 'Delete chat history?'"></h3>
                    <p class="font-body-md text-sm text-on-surface-variant"
                        x-text="lang === 'vi' ? 'Hành động này không thể hoàn tác. Bản đồ tư duy và toàn bộ nội dung thảo luận sẽ bị xóa vĩnh viễn.' : 'This action cannot be undone. The mind map and all discussion content will be permanently deleted.'">
                    </p>
                </div>

                <div class="flex items-center gap-3">
                    <button @click="showDeleteConfirm = false; sessionToDelete = null"
                        class="flex-1 py-3 border border-white/10 rounded-full font-label-sm text-xs uppercase tracking-widest hover:bg-white/5 transition-colors"
                        x-text="lang === 'vi' ? 'Hủy' : 'Cancel'">
                    </button>
                    <button @click="deleteSession()"
                        class="flex-1 py-3 bg-error text-on-error rounded-full font-label-sm text-xs uppercase tracking-widest hover:bg-error/80 transition-colors font-bold"
                        x-text="lang === 'vi' ? 'Xác nhận xóa' : 'Confirm delete'">
                    </button>
                </div>
            </div>
        </div>
    </template>
    <!-- Success Notification Modal -->
    <template x-if="showSuccessModal">
        <div class="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/60 ">
            <div
                class="glass-panel w-full max-w-sm rounded-2xl p-8 flex flex-col items-center text-center gap-6 shadow-2xl border border-white/10 animate-in fade-in zoom-in duration-300">
                <div
                    class="w-20 h-20 rounded-full bg-primary-fixed/20 border border-primary-fixed/30 flex items-center justify-center mb-2">
                    <span
                        class="material-symbols-outlined text-primary-fixed text-4xl animate-bounce">check_circle</span>
                </div>
                <div class="flex flex-col gap-2">
                    <h3 class="font-headline-md text-2xl text-[#fbbf24]">Thành công!</h3>
                    <p class="font-body-md text-on-surface-variant">Bài viết của bạn đã được lan tỏa trên cộng đồng AOA
                        Feed.</p>
                </div>
                <button @click="showSuccessModal = false"
                    class="w-full py-4 bg-primary-fixed text-black rounded-full font-bold uppercase tracking-widest hover:bg-primary-fixed/80 transition-all shadow-[0_0_20px_rgba(233,196,0,0.3)]">
                    Tuyệt vời
                </button>
            </div>
        </div>
    </template>

    <!-- Mobile Floating Switcher Tab Bar -->
    <div
        class="ts-mobile-nav lg:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-surface-container-low/90  border border-outline-variant/40 px-3 py-2 rounded-full flex items-center gap-2 shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition-all duration-300">
        <!-- Chat Panel Button -->
        <button @click="activePanel = 'chat'"
            :class="activePanel === 'chat' ? 'bg-gradient-to-r from-primary-fixed-dim via-primary-fixed to-primary-fixed-dim text-on-primary-fixed shadow-[0_4px_14px_rgba(233,196,0,0.35)] scale-105 font-semibold' : 'text-on-surface-variant hover:text-on-surface hover:bg-white/5'"
            class="flex items-center gap-2 px-5 py-2.5 rounded-full font-label-sm text-[14px] tracking-wider font-bold transition-all duration-300">
            <span class="material-symbols-outlined text-base">chat_bubble</span>
            <span x-text="lang === 'vi' ? 'Trò chuyện' : 'Coach'"></span>
        </button>
        <!-- Mind Map Panel Button -->
        <button
            @click="activePanel = 'map'; $nextTick(() => { setTimeout(() => { try { if ($root && $root.graphData && typeof window.renderBinaryTreeGraph === 'function') { window.renderBinaryTreeGraph('mindmap', $root.graphData, { interactive: true }); } else if (typeof window.updateMindMapTheme === 'function') { window.updateMindMapTheme('mindmap'); } } catch (e) {} }, 150) })"
            :class="activePanel === 'map' ? 'bg-gradient-to-r from-primary-fixed-dim via-primary-fixed to-primary-fixed-dim text-on-primary-fixed shadow-[0_4px_14px_rgba(233,196,0,0.35)] scale-105 font-semibold' : 'text-on-surface-variant hover:text-on-surface hover:bg-white/5'"
            class="flex items-center gap-2 px-5 py-2.5 rounded-full font-label-sm text-[14px] tracking-wider font-bold transition-all duration-300">
            <span class="material-symbols-outlined text-base">hub</span>
            <span x-text="lang === 'vi' ? 'Sơ đồ' : 'Mind Map'"></span>
        </button>
    </div>

    <!-- Global Glassmorphism Toast -->
    <div x-show="showToast" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform translate-y-10"
        x-transition:enter-end="opacity-100 transform translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform translate-y-0"
        x-transition:leave-end="opacity-0 transform translate-y-10"
        class="fixed bottom-24 lg:bottom-10 right-6 z-[9999] flex items-center gap-3 px-5 py-3.5 rounded-2xl border shadow-[0_8px_30px_rgba(0,0,0,0.4)]  !text-white text-white dark:text-[#86efac] dark:text-[#ffb4ab] dark:text-[#fbbf24]"
        :class="toastType === 'success' ? 'bg-[#064e3b]/90 border-[#4ade80]/50 dark:!text-[#86efac]' : (toastType === 'error' ? 'bg-[#450a0a]/90 border-[#ffb4ab]/50 dark:!text-[#ffb4ab]' : 'bg-[#161b22]/90 border-[#ffe16d]/40 dark:!text-[#fbbf24]')"
        style="display: none;">
        <span class="material-symbols-outlined text-[21px]" style="color: inherit;"
            x-text="toastType === 'success' ? 'check_circle' : (toastType === 'error' ? 'error' : 'info')"></span>
        <span class="font-bold text-[15px]" style="color: inherit;" x-text="toastMessage"></span>
    </div>
</body>

</html>

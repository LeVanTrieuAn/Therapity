server {
    listen 80;
    server_name localhost;
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index login.html;

    # Routes mapping to exact HTML files
    location = / {
        try_files /login.html =404;
    }
    
    location = /coach {
        try_files /coach.html =404;
    }

    location = /aoa {
        try_files /aoa.html =404;
    }

    location = /tasks {
        try_files /tasks.html =404;
    }

    location = /analytics {
        try_files /analytics.html =404;
    }

    location = /cohort {
        try_files /cohort.html =404;
    }

    location = /diary {
        try_files /diary.html =404;
    }

    location = /onboarding {
        try_files /onboarding.html =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Serve other static files (allow requests like /onboarding to map to /onboarding.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

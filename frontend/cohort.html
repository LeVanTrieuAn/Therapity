        body {

            animation: pulse-gold 2s ease-in-out infinite;
        }

            border-left: 3px solid #fbbf24;
        }

            border-left: 3px solid rgba(153, 144, 119, 0.4);
        }

            from {
                transform: translateX(-10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .animate-dash {
            animation: dash 1.2s linear infinite;
        }

        @keyframes pulse-emerald {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
            }

            50% {
                box-shadow: 0 0 25px rgba(52, 211, 153, 0.5);
            }
        }

        .pulse-emerald {
            animation: pulse-emerald 2.5s ease-in-out infinite;
        }

        .ts-flag-stack {
            position: relative;
            width: 48px;
            height: 32px;
            display: inline-block;
            cursor: pointer;
        }

        .ts-flag-btn {
            position: absolute;
            top: 0;
            left: 0;
            padding: 5px 7px;
            border-radius: 8px;
            background: rgba(49, 53, 60, 0.15);
            border: 1px solid rgba(77, 71, 50, 0.3);

            align-items: center;

    x-data="{ isSidebarCollapsed: localStorage.getItem('thapsang_sidebar_collapsed') === 'true', toggleSidebar() { this.isSidebarCollapsed = !this.isSidebarCollapsed; localStorage.setItem('thapsang_sidebar_collapsed', this.isSidebarCollapsed); }, lang: localStorage.getItem('thapsang_lang') || 'vi', user: JSON.parse(localStorage.getItem('thapsang_user') || '{}'), logout() { Object.keys(localStorage).forEach(k => { if (k.startsWith('thapsang_cohort_') || k.startsWith('optimistic_aoa_posts') || k === 'thapsang_user' || k === 'thapsang_remembered_email') localStorage.removeItem(k); }); window.location.href='/'; }, async refreshProfile() { if (!this.user.username) return; try { const res = await fetch('/api/v1/auth/profile/' + this.user.username + '?_t=' + Date.now()); if (res.ok) { const p = await res.json(); this.user = { ...this.user, displayName: p.displayName || this.user.displayName, bio: p.bio || this.user.bio, avatar: p.avatar || this.user.avatar, banner: p.banner || this.user.banner, following_list: p.following_list || this.user.following_list || [] }; localStorage.setItem('thapsang_user', JSON.stringify(this.user)); } } catch(e) { console.error('Profile refresh error', e); } } }"

        <!-- Global Toast Notification -->
        <div id="global-toast"
            style="display:none;position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:12px;border:1px solid;box-shadow:0 8px 30px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;transition:opacity 0.3s;opacity:0;pointer-events:none;"
            class="flex items-center gap-3">
            <span id="global-toast-icon"
                style="font-family:'Material Symbols Outlined';font-size:19px;">check_circle</span>
            <span id="global-toast-msg"></span>
        </div>

        <script>
            function showGlobalToast(msg, type) {
                const el = document.getElementById('global-toast');
                const icon = document.getElementById('global-toast-icon');
                const msgEl = document.getElementById('global-toast-msg');
                if (!el) return;
                msgEl.textContent = msg;
                if (type === 'success') {
                    el.style.background = 'rgba(6,78,59,0.95)'; el.style.borderColor = 'rgba(74,222,128,0.5)'; el.style.color = '#86efac'; icon.textContent = 'check_circle';
                } else if (type === 'error') {

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('roadmapApp', () => ({
                lang: localStorage.getItem('thapsang_lang') || 'vi',
                cleanText(text) {
                    if (!text) return '';
                    if (typeof text === 'string' && (text.startsWith('{') || text.startsWith('['))) {
                        return text;
                    }
                    if (text.includes(' ||| ')) {
                        const parts = text.split(' ||| ');
                        if (parts.length > 1) {
                            return this.lang === 'en' ? parts[1].trim() : parts[0].trim();
                        }
                    }
                    let separator = null;
                    if (text.includes(' / ')) separator = ' / ';
                    else if (text.includes(' | ')) separator = ' | ';
                    else if (text.includes('/')) separator = '/';
                    else if (text.includes('|')) separator = '|';

                    if (separator) {
                        const parts = text.split(separator);
                        if (parts.length > 1) {
                            const p0 = parts[0].trim();
                            const p1 = parts[1].trim();

                            // Regex for detecting Vietnamese accented characters
                            const viRegex = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệđìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ]/i;
                            const hasViAccents0 = viRegex.test(p0);
                            const hasViAccents1 = viRegex.test(p1);

                            let vi = p0;
                            let en = p1;

                            if (hasViAccents1 && !hasViAccents0) {
                                vi = p1;
                                en = p0;
                            } else if (hasViAccents0 && !hasViAccents1) {
                                vi = p0;
                                en = p1;
                            } else {
                                // Fallback: check common Vietnamese lowercase words/consonants
                                const commonViWords = /\b(tôi|bạn|học|tuần|nhiệm|vụ|cốt|lõi|bổ|trợ|phụ|bài|nhật|ký|chiêm|nghiệm|định|kiến|thông|tin|mục|tiêu|chặng)\b/i;
                                if (commonViWords.test(p1) && !commonViWords.test(p0)) {
                                    vi = p1;
                                    en = p0;
                                } else if (commonViWords.test(p0) && !commonViWords.test(p1)) {
                                    vi = p0;
                                    en = p1;
                                } else {
                                    vi = p0;
                                    en = p1;
                                }
                            }

                            return this.lang === 'en' ? en : vi;
                        }
                    }
                    return text;
                },
                async saveTaskEssay(task) {
                    try {
                        if (!task.essay) task.essay = '';
                        task.status = 'done'; // Tick task as completed!

                        // 1. Cập nhật giao diện (UI) và Local Storage ngay lập tức
                        localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                        showGlobalToast(this.lang === 'en' ? 'Reflection saved and task marked as completed!' : 'Đã lưu bài luận chiêm nghiệm và hoàn thành nhiệm vụ!', 'success');
                        this.recalculateMyProgress();
                        this.updatePDCAConnection();

                        // 2. Chạy ngầm cập nhật hệ thống lên Server mà không block UI
                        fetch('/api/v1/cohort/tasks/' + task.id, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                status: 'done',
                                subtasks: task.subtasks,
                                essay: task.essay
                            })
                        }).then(async res => {
                            if (res.ok) {
                                const responseData = await res.json();
                                if (responseData.status === 'success' && responseData.task) {
                                    Object.assign(task, responseData.task);
                                }

                                if (this.isQuizUnlocked() && !this.quizData) {
                                    if (!this.quizPollingInterval) {
                                        this.quizPollingInterval = setInterval(async () => {
                                            try {
                                                const username = this.user.email || this.user.username || 'user';
                                                const pollRes = await fetch(`/api/v1/cohort/tasks/${username}`, { cache: 'no-store' });
                                                if (pollRes.ok) {
                                                    const data = await pollRes.json();
                                                    const weekData = data.filter(t => t.week === this.selectedWeekFilter);
                                                    const coreTask = weekData.find(t => t.type === 'core');
                                                    if (coreTask && coreTask.quiz && coreTask.quiz.questions) {
                                                        this.quizData = coreTask.quiz;
                                                        clearInterval(this.quizPollingInterval);
                                                        this.quizPollingInterval = null;
                                                    }
                                                }
                                            } catch (e) {
                                                console.error("Polling error", e);
                                            }
                                        }, 5000); // Poll every 5s while background task generates
                                    }
                                }
                            } else {
                                console.error("Ngầm cập nhật thất bại: Failed to save essay");
                            }
                        }).catch(e => {
                            console.error('Lỗi khi chạy ngầm lưu bài:', e);
                        });
                    } catch (e) {
                        console.error('Lỗi giao diện lưu bài:', e);
                        showGlobalToast(this.lang === 'en' ? 'Error saving task!' : 'Có lỗi xảy ra khi lưu!', 'error');
                    }
                },

                async init() {
                    this.pageLoading = true;
                    document.body.classList.add('overflow-hidden');
                    this.$watch('activeTab', (val) => {
                        localStorage.setItem('thapsang_cohort_active_tab', val);
                    });
                    this.$watch('pageLoading', (val) => {
                        if (val) {
                            document.body.classList.add('overflow-hidden');
                        } else {
                            document.body.classList.remove('overflow-hidden');
                        }
                    });
                    this.$watch('selectedWeekFilter', async (newVal, oldVal) => {
                        if (newVal !== oldVal) {
                            this.isRetrying = false;
                            this.justSubmitted = false;
                            this.pageLoading = true;
                            this.quizData = null;
                            this.quizResult = null;
                            this.userAnswers = Array(8).fill(null);
                            await this.loadAll();
                            setTimeout(() => { this.pageLoading = false; }, 300);
                        }
                    });

                    window.addEventListener('ts-lang-changed', (e) => {
                        this.lang = e.detail.lang;
                        this.updatePDCAConnection();
                    });
                    window.addEventListener('language-changed', (e) => {
                        this.lang = e.detail;
                    });
                    // Initial load to discover current week
                    await this.loadAll();
                    // Set default filter to current cohort week
                    this.selectedWeekFilter = this.getCurrentCohortWeek();
                    // Reload specifically for the active week's quiz data
                    await this.loadAll();

                    // Trì hoãn nhẹ 400ms để hiệu ứng loading chuyển trang mượt mà
                    setTimeout(() => {

                startSimulatedProgress() {
                    this.personalizingProgress = 0;
                    if (this.progressInterval) clearInterval(this.progressInterval);
                    this.progressInterval = setInterval(() => {
                        if (this.personalizingProgress < 90) {
                            this.personalizingProgress += Math.floor(Math.random() * 5) + 2;
                            if (this.personalizingProgress > 90) this.personalizingProgress = 90;
                        }
                    }, 500);
                },

                completeSimulatedProgress() {
                    if (this.progressInterval) clearInterval(this.progressInterval);
                    this.personalizingProgress = 100;
                },

                async loadAll() {
                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const weekParam = this.selectedWeekFilter || 1;
                        const [syllRes, actRes] = await Promise.all([
                            fetch('/api/v1/cohort/syllabus?username=' + encodeURIComponent(username) + '&week=' + weekParam).then(r => r.json()),
                            fetch('/api/v1/cohort/activity').then(r => r.json())
                        ]);
                        this.syllabus = syllRes.syllabus || [];
                        this.cohortInfo = syllRes.cohort_info || {};
                        if (this.cohortInfo.weekly_progress_history) {
                            try {
                                const historyKey = `thapsang_cohort_weekly_progress_history_${username}`;
                                const oldHistory = JSON.parse(localStorage.getItem(historyKey) || '{}');
                                const newHistory = this.cohortInfo.weekly_progress_history;
                                const mergedHistory = { ...oldHistory };
                                for (const w in newHistory) {
                                    const newVal = Number(newHistory[w] || 0);
                                    const oldVal = Number(oldHistory[w] || 0);
                                    mergedHistory[w] = Math.max(newVal, oldVal);
                                }
                                localStorage.setItem(historyKey, JSON.stringify(mergedHistory));
                            } catch (he) {
                                const historyKey = `thapsang_cohort_weekly_progress_history_${username}`;
                                localStorage.setItem(historyKey, JSON.stringify(this.cohortInfo.weekly_progress_history));
                            }
                        }

                        // Quiz extraction is now done below from tasks
                        this.activityFeed = actRes.feed || [];
                        this.bottleneck = actRes.bottleneck || {};
                        this.pivot = actRes.pivot || {};

                        let oldSelfProgress = 0;
                        if (this.members && this.members.length > 0) {
                            const oldSelf = this.members.find(m => m.is_self);
                            if (oldSelf) {
                                oldSelfProgress = oldSelf.week_progress || 0;
                            }
                        }

                        const [membRes, tasksRes] = await Promise.all([
                            fetch('/api/v1/cohort/members').then(r => r.json()),
                            fetch('/api/v1/cohort/tasks/' + username, { cache: 'no-store' }).then(r => r.json())
                        ]);
                        this.members = membRes.members || [];
                        this.cohortTasks = tasksRes || [];

                        // Extract active quiz from the core task of the selected week
                        const weekData = this.cohortTasks.filter(t => t.week === this.selectedWeekFilter);
                        const coreTask = weekData.find(t => t.type === 'core');
                        const q = coreTask && coreTask.quiz && coreTask.quiz.questions ? coreTask.quiz : null;
                        if (q) {
                            const fetchedAttempt = q.attempts && q.attempts.length > 0 ? q.attempts[q.attempts.length - 1] : null;
                            if (fetchedAttempt) {
                                if (this.justSubmitted && this.quizResult) {
                                    // Verify if the fetched attempt is the one we just submitted (database sync is done)
                                    const isMatch = fetchedAttempt.timestamp === this.quizResult.timestamp ||
                                        (fetchedAttempt.total_score === this.quizResult.total_score &&
                                            JSON.stringify(fetchedAttempt.answers) === JSON.stringify(this.quizResult.answers));
                                    if (isMatch) {
                                        this.justSubmitted = false;
                                        this.quizResult = fetchedAttempt;
                                        this.userAnswers = this.quizResult.answers ? [...this.quizResult.answers] : Array(8).fill(null);
                                    } else {
                                        // Still stale, keep our local correct result
                                    }
                                } else {
                                    const localTimestamp = this.quizResult && this.quizResult.timestamp ? this.quizResult.timestamp : null;
                                    const fetchedTimestamp = fetchedAttempt.timestamp ? fetchedAttempt.timestamp : null;

                                    // Only overwrite if we don't have a local quizResult or the fetched attempt is newer/equal
                                    if (!this.quizResult || !localTimestamp || !fetchedTimestamp || new Date(fetchedTimestamp).getTime() >= new Date(localTimestamp).getTime()) {
                                        // If we are currently retrying, do not overwrite the cleared states with the old fetched attempt
                                        if (!this.isRetrying) {
                                            this.quizResult = fetchedAttempt;
                                            this.userAnswers = this.quizResult.answers ? [...this.quizResult.answers] : Array(8).fill(null);
                                        }
                                    }
                                }
                            } else {
                                // If the server returns no attempts (e.g. stale cache on first submission),
                                // do NOT overwrite the local quizResult we just created.
                                if (!this.justSubmitted) {
                                    this.quizResult = null;
                                    this.userAnswers = Array(8).fill(null);
                                }
                            }
                            this.quizData = q;
                        } else {
                            if (!this.justSubmitted) {
                                this.quizData = null;
                                this.quizResult = null;
                                this.userAnswers = Array(8).fill(null);
                            }
                        }

                        let hasSelf = false;
                        let isCompleted = false;
                        this.members.forEach(m => {
                            const mUser = (m.username || "").trim().toLowerCase();
                            const selfUser = (this.user.username || "").trim().toLowerCase();
                            const selfEmail = (this.user.email || "").trim().toLowerCase();
                            if (m.is_self || mUser === selfUser || mUser === selfEmail || mUser === 'user' || mUser === 'bạn') {
                                m.username = this.user.username || 'user';
                                m.display_name = this.user.displayName || this.user.username || 'Bạn';
                                m.is_self = true;
                                hasSelf = true;

                                if (oldSelfProgress > m.week_progress) {
                                    m.week_progress = oldSelfProgress;
                                }

                                const currentWeek = this.cohortInfo.current_week || 1;
                                const totalWeeks = this.cohortInfo.total_weeks || 12;
                                if (currentWeek >= totalWeeks && m.week_progress >= 100) {
                                    isCompleted = true;
                                }
                            }
                        });

                        if (isCompleted) {
                            localStorage.removeItem('thapsang_cohort_activated_' + (this.user.username || 'user'));
                            hasSelf = false;
                        } else {
                            if (localStorage.getItem('thapsang_cohort_activated_' + (this.user.username || 'user')) === 'true') {
                                hasSelf = true;
                            }
                        }
                        this.isEnrolled = hasSelf;

                        if (!this.isEnrolled) {
                            try {
                                const checkRes = await fetch('/api/v1/cohort/check-context?username=' + encodeURIComponent(username)).then(r => r.json());
                                this.contextCheck.count = checkRes.prompt_count || 0;
                                this.contextCheck.isSufficient = checkRes.is_sufficient || false;
                                this.contextCheck.loaded = true;
                            } catch (ce) {
                                console.error("Error checking dialogue context:", ce);
                            }
                        }

                        localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                        this.addedTasks = new Set();
                        this.cohortTasks.forEach(t => this.addedTasks.add(t.title));

                        this.updatePDCAConnection();
                    } catch (e) {
                        console.error('loadAll error', e);
                    }
                },

                async startAICohortAllocation() {
                    this.joiningLoading = true;
                    this.matchingProgress = 5;

                    const statuses = this.lang === 'en' ? [
                        "Ingesting Socratic dialogue history...",
                        "Mapping cognitive ruptures & logic structures...",
                        "Analyzing personal goals and growth criteria...",
                        "Synthesizing custom cognitive development patterns...",
                        "Populating personalized syllabus tasks...",
                        "Allocation success! Welcome to your Personal Roadmap."
                    ] : [
                        "Đọc hiểu lịch sử hội thoại Socratic...",
                        "Lập bản đồ đứt gãy nhận thức và cấu trúc logic...",
                        "Phân tích mục tiêu cá nhân và tiêu chuẩn tăng trưởng...",
                        "Kiến tạo các mô thức phát triển nhận thức cá nhân...",
                        "Đồng bộ hóa nhiệm vụ syllabus cá nhân hóa...",
                        "Gia nhập thành công! Lộ trình cá nhân của bạn đã sẵn sàng."
                    ];

                    const interval = setInterval(() => {
                        if (this.matchingProgress < 95) {
                            this.matchingProgress += Math.floor(Math.random() * 15) + 5;
                            if (this.matchingProgress > 95) this.matchingProgress = 95;

                            const stepIdx = Math.floor((this.matchingProgress / 100) * statuses.length);
                            this.matchingStatusText = statuses[stepIdx] || statuses[statuses.length - 1];
                        }
                    }, 600);

                    try {
                        const res = await fetch('/api/v1/cohort/join', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.user.email || this.user.username || 'user',
                                display_name: this.user.displayName || this.user.username || 'Bạn',
                                current_tasks: this.cohortTasks
                            })
                        });

                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === "insufficient_info") {
                                clearInterval(interval);
                                this.joiningLoading = false;
                                this.insufficientInfo = true;
                                this.insufficientMessage = data.message;
                                showGlobalToast('⚠️ ' + data.message, 'error');
                            } else {
                                this.insufficientInfo = false; // Reset if successful
                                localStorage.setItem('thapsang_cohort_activated_' + (this.user.username || 'user'), 'true');
                                setTimeout(async () => {
                                    clearInterval(interval);
                                    this.matchingProgress = 100;
                                    this.matchingStatusText = statuses[statuses.length - 1];

                                    setTimeout(async () => {
                                        await this.loadAll();
                                        this.isEnrolled = true;
                                        this.joiningLoading = false;
                                        showGlobalToast((this.lang === 'en' ? 'Roadmap synthesized successfully!' : 'Đã kiến tạo lộ trình cá nhân thành công!'), 'success');
                                    }, 800);
                                }, 3500);
                            }
                        } else {
                            throw new Error("Join API failed");
                        }
                    } catch (e) {
                        clearInterval(interval);
                        this.joiningLoading = false;
                        alert("AI Personal Roadmap allocation error. Please try again. ");
                    }
                },

                isTaskAdded(title) {
                    return this.addedTasks.has(title);
                },

                getCohortTasks() {
                    return this.cohortTasks || [];
                },

                async toggleTaskStatus(task) {
                    try {
                        const newStatus = task.status === 'done' ? 'backlog' : 'done';
                        task.status = newStatus;

                        this.recalculateMyProgress();
                        this.updatePDCAConnection();

                        const res = await fetch('/api/v1/cohort/tasks/' + task.id, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                status: newStatus,
                                subtasks: task.subtasks
                            })
                        });

                        if (res.ok) {
                            localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                        } else {
                            throw new Error("Failed to sync task status to server");
                        }
                    } catch (e) {
                        console.error('Error toggling task status:', e);
                    }
                },

                getCurrentCohortWeek() {
                    return this.cohortInfo.current_week || 1;
                },

                saveWeeklyProgressHistory(week, progress) {
                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const historyKey = `thapsang_cohort_weekly_progress_history_${username}`;
                        const history = JSON.parse(localStorage.getItem(historyKey) || '{}');
                        history[week] = progress;
                        localStorage.setItem(historyKey, JSON.stringify(history));
                    } catch (e) { console.error('Save weekly history error', e); }
                },

                getWeeklyProgressList() {
                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const historyKey = `thapsang_cohort_weekly_progress_history_${username}`;
                        const history = JSON.parse(historyKey ? (localStorage.getItem(historyKey) || '{}') : '{}');
                        const currentWeek = this.getCurrentCohortWeek();
                        let list = [];
                        for (let w = 1; w <= 12; w++) {
                            let prog = 0;
                            const val = history[w] !== undefined ? history[w] : history[w.toString()];
                            if (w < currentWeek) {
                                prog = val !== undefined ? Number(val) : 100;
                            } else if (w === currentWeek) {
                                if (this.quizResult && this.quizResult.total_score !== undefined) {
                                    prog = this.quizResult.total_score;
                                } else {
                                    prog = val !== undefined ? Number(val) : 0;
                                }
                            } else {
                                prog = 0;
                            }
                            list.push(prog);
                        }
                        return list;
                    } catch (e) { return Array(12).fill(0); }
                },

                getChartPoints() {
                    const list = this.getWeeklyProgressList();
                    let points = [];
                    for (let i = 0; i < 12; i++) {
                        const x = 40 + i * 38.18;
                        const y = 160 - (list[i] / 100) * 140;
                        points.push(`${x},${y}`);
                    }
                    return points.join(' ');
                },

                getChartAreaPoints() {
                    const list = this.getWeeklyProgressList();
                    let points = ['40,160'];
                    for (let i = 0; i < 12; i++) {
                        const x = 40 + i * 38.18;
                        const y = 160 - (list[i] / 100) * 140;
                        points.push(`${x},${y}`);
                    }
                    points.push('460,160');
                    return points.join(' ');
                },

                recalculateMyProgress() {
                    try {
                        const currentWeek = this.selectedWeekFilter;
                        let progress = 0;
                        if (this.quizData && this.quizData.total_score !== undefined) {
                            progress = this.quizData.total_score;
                        } else if (this.quizResult && this.quizResult.total_score !== undefined) {
                            progress = this.quizResult.total_score;
                        } else {
                            progress = 0;
                        }
                        const me = this.members.find(m => m.is_self);
                        if (me) me.week_progress = progress;
                        this.members = [...this.members];
                        this.syncProgressToServer(progress);
                        this.saveWeeklyProgressHistory(currentWeek, progress);

                        const totalWeeks = this.cohortInfo.total_weeks || 12;
                        if (currentWeek >= totalWeeks && progress >= 100) {
                            localStorage.removeItem('thapsang_cohort_activated_' + (this.user.username || 'user'));
                            this.isEnrolled = false;
                        }
                    } catch (e) { console.error('Progress calculation error', e); }
                },

                syncProgressToServer(progress) {
                    fetch('/api/v1/cohort/update-progress', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: this.user.email || this.user.username || 'user', week_progress: progress })
                    }).then(res => {
                        if (res.ok) {
                            this.activityFeed.unshift({
                                type: 'success', user: 'Bạn',
                                action: 'vừa cập nhật tiến độ lên', target: progress + '%!', time: 'Vừa xong'
                            });
                        }
                    }).catch(err => console.error('Failed to sync progress', err));
                },

                async startLearningWeek(weekObj) {
                    if (this.personalizingLoading) return;
                    const isEn = this.lang === 'en';
                    this.selectedWeekFilter = weekObj.week;

                    // Fallback Protection: Check if tasks for this week are completely empty (null/deleted by admin)
                    const weekTasks = (this.cohortTasks || []).filter(t => t.week === weekObj.week);
                    const isNull = weekTasks.length === 0;

                    if (isNull) {
                        this.personalizingLoading = true;
                        this.startSimulatedProgress();
                        this.personalizingStatusText = {
                            en: `Socratic AI Coach is custom-generating your Week ${weekObj.week} tasks based on your Socratic history...`,
                            vi: `AI Coach Socratic đang phân tích lịch sử hội thoại để kiến tạo nhiệm vụ Tuần ${weekObj.week} cho bạn...`
                        };

                        try {
                            const username = this.user.email || this.user.username || 'user';
                            const res = await fetch('/api/v1/cohort/personalize-week', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: username,
                                    week: weekObj.week
                                })
                            });

                            if (res.ok) {
                                const resultObj = await res.json();
                                if (resultObj.status === "error") {
                                    throw new Error(resultObj.message || "Backend error during personalization");
                                }

                                // Reload tasks from server
                                const tasksRes = await fetch('/api/v1/cohort/tasks/' + username).then(r => r.json());
                                this.cohortTasks = tasksRes || [];
                                localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                                
                                // Reload syllabus from server to update timeline titles instantly
                                const weekParam = this.selectedWeekFilter || 1;
                                const syllRes = await fetch('/api/v1/cohort/syllabus?username=' + encodeURIComponent(username) + '&week=' + weekParam).then(r => r.json());
                                this.syllabus = syllRes.syllabus || [];

                                this.recalculateMyProgress();
                                this.updatePDCAConnection();

                                // Reload syllabus and Socratic quiz for the newly generated week
                                await this.loadAll();
                                this.completeSimulatedProgress();

                                this.personalizingStatusText = {
                                    en: "Customization complete! Loading tasks...",
                                    vi: "Kiến tạo thành công! Đang đồng bộ hóa nhiệm vụ..."
                                };
                                setTimeout(() => {
                                    this.personalizingLoading = false;
                                    showGlobalToast(isEn ? `Week ${weekObj.week} Socratic tasks created!` : `Đã khởi tạo nhiệm vụ Socratic Tuần ${weekObj.week}!`, 'success');
                                    document.getElementById('personal-tasks-section').scrollIntoView({ behavior: 'smooth' });
                                    localStorage.setItem('thapsang_cohort_active_tab', 'roadmap');
                                    setTimeout(() => {
                                        window.location.reload();
                                    }, 1000);
                                }, 800);
                            } else if (res.status === 500) {
                                const resultObj = await res.json();
                                this.completeSimulatedProgress();
                                setTimeout(() => {
                                    this.personalizingLoading = false;
                                    showGlobalToast(isEn ? "AI model timed out. Using fallback tasks!" : "Mô hình AI phản hồi chậm. Đã tự động dùng nhiệm vụ dự phòng!", 'warning');
                                    document.getElementById('personal-tasks-section').scrollIntoView({ behavior: 'smooth' });
                                    localStorage.setItem('thapsang_cohort_active_tab', 'roadmap');
                                    setTimeout(() => {
                                        window.location.reload();
                                    }, 1000);
                                }, 400);
                                
                                // Make sure to load tasks in background before reload
                                const tasksRes = await fetch('/api/v1/cohort/tasks/' + username).then(r => r.json());
                                this.cohortTasks = tasksRes || [];
                                localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                            } else {
                                this.completeSimulatedProgress();
                                setTimeout(() => {
                                    this.personalizingLoading = false;
                                }, 400);
                                const errorData = await res.json();
                                showGlobalToast(errorData.detail || (isEn ? 'Personalization locked or failed.' : 'Kích hoạt cá nhân hóa bị khóa hoặc thất bại.'), 'error');
                            }
                        } catch (err) {
                            this.completeSimulatedProgress();
                            setTimeout(() => {
                                this.personalizingLoading = false;
                            }, 400);
                            console.error("Failed to personalize week:", err);
                            showGlobalToast(isEn ? 'Failed to connect to personalization service.' : 'Không thể kết nối đến dịch vụ cá nhân hóa.', 'error');
                        }
                    } else {
                        // Already exists, NO modal loading. The page watcher handles the data loading overlay.
                        document.getElementById('personal-tasks-section').scrollIntoView({ behavior: 'smooth' });
                    }
                },


                openTaskDetails(task) {
                    this.currentActiveTask = JSON.parse(JSON.stringify(task));
                    this.taskDetailsModalOpen = true;
                },

                saveTaskDetails() {
                    if (!this.currentActiveTask) return;
                    try {
                        const idx = this.cohortTasks.findIndex(t => t.id === this.currentActiveTask.id);
                        if (idx !== -1) {
                            const allSubDone = this.currentActiveTask.subtasks &&
                                this.currentActiveTask.subtasks.length > 0 &&
                                this.currentActiveTask.subtasks.every(s => s.done);
                            if (allSubDone) {
                                this.currentActiveTask.status = 'done';
                            } else if (this.currentActiveTask.subtasks &&
                                this.currentActiveTask.subtasks.length > 0 &&
                                this.currentActiveTask.subtasks.some(s => s.done)) {
                                this.currentActiveTask.status = 'backlog';
                            }

                            this.cohortTasks[idx] = this.currentActiveTask;
                            this.recalculateMyProgress();
                            this.updatePDCAConnection();

                            fetch('/api/v1/cohort/tasks/' + this.currentActiveTask.id, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    status: this.currentActiveTask.status,
                                    subtasks: this.currentActiveTask.subtasks
                                })
                            }).then(res => {
                                if (res.ok) {
                                    localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                                }
                            });

                            showGlobalToast(this.lang === 'en' ? 'Task updated!' : 'Đã cập nhật nhiệm vụ!', 'success');
                        }
                    } catch (e) { }
                    this.taskDetailsModalOpen = false;
                    this.currentActiveTask = null;
                },

                toggleSubtask(subtask) {
                    subtask.done = !subtask.done;
                    const allDone = this.currentActiveTask.subtasks.every(s => s.done);
                    if (allDone) {
                        this.currentActiveTask.status = 'done';
                    } else {
                        this.currentActiveTask.status = 'backlog';
                    }

                    this.recalculateMyProgress();
                    this.updatePDCAConnection();

                    fetch('/api/v1/cohort/tasks/' + this.currentActiveTask.id, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            status: this.currentActiveTask.status,
                            subtasks: this.currentActiveTask.subtasks
                        })
                    }).then(res => {
                        if (res.ok) {
                            localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                        }
                    }).catch(e => console.error('Immediate subtask toggle sync error', e));
                },

                toggleSubtaskInline(task, subtask) {
                    subtask.done = !subtask.done;
                    const allDone = task.subtasks.every(s => s.done);
                    if (allDone) {
                        task.status = 'done';
                    } else {
                        task.status = 'backlog';
                    }

                    this.recalculateMyProgress();
                    this.updatePDCAConnection();

                    fetch('/api/v1/cohort/tasks/' + task.id, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            status: task.status,
                            subtasks: task.subtasks
                        })
                    }).then(res => {
                        if (res.ok) {
                            localStorage.setItem(`thapsang_cohort_tasks_${this.user.username || 'user'}`, JSON.stringify(this.cohortTasks));
                        }
                    }).catch(e => console.error('Immediate inline subtask toggle sync error', e));
                },

                async loadRetro(force = false) {
                    if (this.retro.loaded && !force) return;
                    this.retro.loading = true;
                    try {
                        const cohortTasks = this.getCohortTasks();
                        const me = this.members.find(m => m.is_self);
                        const progress = me ? (me.week_progress || 0) : 0;
                        const res = await fetch('/api/v1/cohort/ai-retrospective', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.user.email || this.user.username || 'user',
                                display_name: this.user.displayName || this.user.username || 'Bạn',
                                progress, tasks: cohortTasks, lang: this.lang
                            })
                        });
                        const data = await res.json();
                        this.retro.text = data.retrospective;
                        this.retro.avg_progress = data.avg_progress;
                        this.retro.loaded = true;
                    } catch (e) {
                        this.retro.text = this.lang === 'en'
                            ? 'System error connecting to AI Coach. Please try again.'
                            : 'Hệ thống gặp lỗi khi kết nối với AI Coach. Vui lòng thử lại sau.';
                    } finally {
                        this.retro.loading = false;
                    }
                },

                async updatePDCAConnection() {
                    try {
                        const cohortTasks = this.getCohortTasks();
                        const total = cohortTasks.length;
                        const isEn = this.lang === 'en';
                        if (total === 0) {
                            this.bottleneck = { late_percentage: 0, ai_insight: isEn ? "You haven't selected any goals from the PLAN of this week." : "Bạn chưa chọn bất kỳ mục tiêu nào từ PLAN tuần này.", bottlenecks: [{ label: isEn ? "DO process not activated" : "Chưa kích hoạt quy trình DO", percentage: 100, type: "error" }] };
                            this.pivot = { triggered: false, reason: isEn ? "No action data found. Please switch to the PLAN tab." : "Chưa có dữ liệu. Vui lòng chuyển sang tab PLAN để bắt đầu.", pivot_task: null };
                            return;
                        }
                        if (this.bottleneckLoading) return;
                        this.bottleneckLoading = true;

                        const me = this.members.find(m => m.is_self);
                        const progress = me ? (me.week_progress || 0) : 0;

                        const res = await fetch('/api/v1/cohort/ai-bottleneck', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.user.email || this.user.username || 'user',
                                progress,
                                tasks: cohortTasks,
                                lang: this.lang
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.bottleneck = data;
                            this.pivot = data.pivot || {};
                        }
                    } catch (e) {
                        console.error('updatePDCAConnection error', e);
                    } finally {
                        this.bottleneckLoading = false;
                    }
                },

                shareToAOA() { window.location.href = '/aoa'; },

                getHeatmapClass(member) {
                    if (member.is_self) return 'heatmap-cell-self pulse-gold';
                    const p = member.week_progress || 0;
                    if (p >= 80) return 'heatmap-cell-high';
                    if (p >= 50) return 'heatmap-cell-mid';
                    if (p > 0) return 'heatmap-cell-low';
                    return 'heatmap-cell-0';
                },

                getAvgProgress() {
                    if (!this.members.length) return 0;
                    return Math.round(this.members.reduce((s, m) => s + (m.week_progress || 0), 0) / this.members.length);
                },

                showToast(msg, type = 'success') { showGlobalToast(msg, type); },

                onTabChange(tab) {
                    this.activeTab = tab;
                },

                isQuizUnlocked() {
                    const currentWeek = this.selectedWeekFilter;
                    const weekTasks = (this.cohortTasks || []).filter(t => t.week === currentWeek);
                    if (weekTasks.length === 0) return false;

                    const completedTasks = weekTasks.filter(t =>
                        t.status === 'done' && !!t.essay && t.essay.trim().length > 0
                    );

                    const completedCoreTasks = completedTasks.filter(t => t.type === 'core');
                    const completedSuppTasks = completedTasks.filter(t => t.type === 'supplementary');

                    return (completedCoreTasks.length >= 1 && completedSuppTasks.length >= 1) || (completedCoreTasks.length >= 2);
                },

                isQuizSectionVisible() {
                    return this.isEnrolled;
                },

                async generateQuiz() {
                    this.quizLoading = true;
                    this.quizResult = null;
                    this.userAnswers = Array(8).fill(null);
                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const currentWeek = this.selectedWeekFilter;
                        const res = await fetch('/api/v1/cohort/generate-quiz', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: username,
                                week: currentWeek,
                                lang: this.lang
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.quizData = data;
                            this.userAnswers = Array(8).fill(null);
                        } else {
                            const err = await res.json();
                            showGlobalToast(err.detail || 'Failed to generate quiz.', 'error');
                        }
                    } catch (e) {
                        console.error("Quiz generate error:", e);
                        showGlobalToast('Connection failed.', 'error');
                    } finally {
                        this.quizLoading = false;
                    }
                },

                async submitQuiz() {
                    if (this.userAnswers.includes(null)) {
                        showGlobalToast(this.lang === 'en' ? 'Please answer all 8 questions!' : 'Vui lòng hoàn thành tất cả 8 câu hỏi!', 'warning');
                        return;
                    }
                    this.quizSubmitting = true;
                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const currentWeek = this.selectedWeekFilter;
                        const res = await fetch('/api/v1/cohort/submit-quiz', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: username,
                                week: currentWeek,
                                answers: this.userAnswers,
                                lang: this.lang
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.quizResult = data.attempt || data;
                            if (this.quizResult && this.quizResult.answers) {
                                this.userAnswers = [...this.quizResult.answers];
                            }
                            this.isRetrying = false;
                            this.justSubmitted = true;

                            // Update self-progress locally to prevent progress donut from jumping back
                            if (this.members && this.quizResult) {
                                const selfMember = this.members.find(m => m.is_self);
                                if (selfMember) {
                                    selfMember.week_progress = Math.round(this.quizResult.total_score || 0);
                                }
                            }

                            showGlobalToast(this.lang === 'en' ? 'Quiz graded!' : 'Đã nộp và nhận điểm phản chiếu!', 'success');
                            await this.loadAll();
                        } else {
                            const err = await res.json();
                            showGlobalToast(err.detail || 'Failed to submit quiz.', 'error');
                        }
                    } catch (e) {
                        console.error("Quiz submit error:", e);
                        showGlobalToast('Submission failed.', 'error');
                    } finally {
                        this.quizSubmitting = false;
                    }
                },

                retryQuiz() {
                    this.quizResult = null;
                    this.userAnswers = Array(8).fill(null);
                    this.isRetrying = true;
                },

                async nextCohortWeek() {
                    if (this.personalizingLoading) return;
                    const nextWeekNum = this.selectedWeekFilter + 1;
                    if (nextWeekNum > 12) {
                        showGlobalToast(this.lang === 'en' ? 'You have completed the entire 12-week roadmap!' : 'Chúc mừng! Bạn đã hoàn thành toàn bộ lộ trình 12 tuần!', 'success');
                        return;
                    }

                    const highestUnlockedWeek = this.cohortInfo ? this.cohortInfo.current_week : 1;

                    if (nextWeekNum <= highestUnlockedWeek) {
                        // Week is already unlocked, just navigate to it
                        this.selectedWeekFilter = nextWeekNum;
                        await this.loadAll();
                        this.retryQuiz();
                        document.getElementById('personal-tasks-section').scrollIntoView({ behavior: 'smooth' });
                        return;
                    }

                    this.personalizingLoading = true;
                    this.startSimulatedProgress();
                    this.personalizingStatusText = {
                        en: `Socratic AI is custom-personalizing your Week ${nextWeekNum} tasks...`,
                        vi: `AI Socratic đang bắt đầu thiết kế riêng các nhiệm vụ Tuần ${nextWeekNum}...`
                    };

                    try {
                        const username = this.user.email || this.user.username || 'user';
                        const res = await fetch('/api/v1/cohort/personalize-week', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: username,
                                week: nextWeekNum
                            })
                        });

                        if (res.ok) {
                            const responseText = await res.text(); // Wait for the StreamingResponse to finish
                            try {
                                const resultObj = JSON.parse(responseText.trim());
                                if (resultObj.status === "error") {
                                    throw new Error(resultObj.message || "Backend error during personalization");
                                }
                            } catch (e) {
                                throw e;
                            }

                            await this.loadAll();
                            this.selectedWeekFilter = nextWeekNum;
                            this.retryQuiz();
                            this.personalizingStatusText = {
                                en: 'Success! Loading next week tasks...',
                                vi: 'Hoàn thành! Đang chuyển sang chặng mới...'
                            };

                            this.completeSimulatedProgress();
                            setTimeout(() => {
                                this.personalizingLoading = false;
                                showGlobalToast(this.lang === 'en' ? `Unlocked Week ${nextWeekNum} successfully!` : `Đã mở khóa Tuần ${nextWeekNum} thành công!`, 'success');
                                document.getElementById('personal-tasks-section').scrollIntoView({ behavior: 'smooth' });
                            }, 400);
                        } else {
                            this.completeSimulatedProgress();
                            setTimeout(() => { this.personalizingLoading = false; }, 400);
                            const errorData = await res.json();
                            showGlobalToast(errorData.detail || 'Unlock failed.', 'error');
                        }
                    } catch (err) {
                        this.completeSimulatedProgress();
                        setTimeout(() => { this.personalizingLoading = false; }, 400);
                        console.error("Unlock error:", err);
                        showGlobalToast('Failed to connect to unlock service.', 'error');
                    }
                }
            }));
        });
    </script>
</body>
